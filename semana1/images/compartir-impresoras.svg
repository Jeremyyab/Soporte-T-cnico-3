<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="520" height="340" fill="#f0fdf4" rx="12"/>
  <text x="260" y="25" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#15803d" font-weight="700">Compartir Impresoras en Red</text>
  <!-- Network diagram -->
  <rect x="205" y="40" width="110" height="60" rx="8" fill="#16a34a" opacity="0.85"/>
  <text x="260" y="66" text-anchor="middle" font-size="22">🖨️</text>
  <text x="260" y="84" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white" font-weight="600">Impresora compartida</text>
  <rect x="30" y="160" width="90" height="50" rx="8" fill="#0b66c3" opacity="0.7"/>
  <text x="75" y="182" text-anchor="middle" font-size="18">💻</text>
  <text x="75" y="200" text-anchor="middle" font-family="sans-serif" font-size="9" fill="white">PC Dpto A</text>
  <rect x="215" y="160" width="90" height="50" rx="8" fill="#0b66c3" opacity="0.7"/>
  <text x="260" y="182" text-anchor="middle" font-size="18">💻</text>
  <text x="260" y="200" text-anchor="middle" font-family="sans-serif" font-size="9" fill="white">PC Dpto B</text>
  <rect x="400" y="160" width="90" height="50" rx="8" fill="#0b66c3" opacity="0.7"/>
  <text x="445" y="182" text-anchor="middle" font-size="18">💻</text>
  <text x="445" y="200" text-anchor="middle" font-family="sans-serif" font-size="9" fill="white">PC Dpto C</text>
  <line x1="120" y1="155" x2="215" y2="100" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="260" y1="160" x2="260" y2="100" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="400" y1="155" x2="305" y2="100" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Steps -->
  <rect x="15" y="225" width="230" height="100" rx="8" fill="white" opacity="0.75" stroke="#16a34a" stroke-opacity="0.3"/>
  <text x="130" y="243" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#15803d" font-weight="700">Compartir desde servidor</text>
  <text x="25" y="260" font-family="sans-serif" font-size="9.5" fill="#475569">1. Panel Control → Dispositivos e impresoras</text>
  <text x="25" y="276" font-family="sans-serif" font-size="9.5" fill="#475569">2. Clic derecho → Propiedades de impresora</text>
  <text x="25" y="292" font-family="sans-serif" font-size="9.5" fill="#475569">3. Tab Compartir → Compartir esta impresora</text>
  <text x="25" y="308" font-family="sans-serif" font-size="9.5" fill="#475569">4. Asignar nombre de recurso compartido</text>
  <text x="25" y="318" font-family="sans-serif" font-size="9.5" fill="#475569">5. Habilitar Compartir archivos e impresoras</text>
  <rect x="260" y="225" width="245" height="100" rx="8" fill="white" opacity="0.75" stroke="#0b66c3" stroke-opacity="0.3"/>
  <text x="382" y="243" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0b66c3" font-weight="700">Conectar desde cliente</text>
  <text x="270" y="260" font-family="sans-serif" font-size="9.5" fill="#475569">1. Inicio → \\servidor\nombre-impresora</text>
  <text x="270" y="276" font-family="sans-serif" font-size="9.5" fill="#475569">2. O buscar impresora en red</text>
  <text x="270" y="292" font-family="sans-serif" font-size="9.5" fill="#475569">3. Instalar driver automáticamente</text>
  <text x="270" y="308" font-family="sans-serif" font-size="9.5" fill="#475569">4. Verificar permisos de impresión</text>
  <text x="270" y="318" font-family="sans-serif" font-size="9.5" fill="#475569">5. Probar impresión de prueba</text>
</svg>
