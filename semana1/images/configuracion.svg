<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="520" height="340" fill="#f0f9ff" rx="12"/>
  <text x="260" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0284c7" font-weight="700">Configuración de Impresoras en Windows</text>
  <!-- Flowchart -->
  <rect x="185" y="40" width="150" height="36" rx="8" fill="#0b66c3" opacity="0.85"/>
  <text x="260" y="63" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white" font-weight="600">Conectar Impresora</text>
  <line x1="260" y1="76" x2="260" y2="94" stroke="#0b66c3" stroke-width="2"/>
  <polygon points="255,94 265,94 260,102" fill="#0b66c3"/>
  <rect x="185" y="102" width="150" height="36" rx="8" fill="#0284c7" opacity="0.75"/>
  <text x="260" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white" font-weight="600">Instalar Driver</text>
  <line x1="260" y1="138" x2="260" y2="156" stroke="#0b66c3" stroke-width="2"/>
  <polygon points="255,156 265,156 260,164" fill="#0b66c3"/>
  <rect x="185" y="164" width="150" height="36" rx="8" fill="#0369a1" opacity="0.65"/>
  <text x="260" y="183" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white" font-weight="600">Configurar como</text>
  <text x="260" y="196" text-anchor="middle" font-family="sans-serif" font-size="9" fill="white">predeterminada</text>
  <line x1="260" y1="200" x2="260" y2="218" stroke="#0b66c3" stroke-width="2"/>
  <polygon points="255,218 265,218 260,226" fill="#0b66c3"/>
  <rect x="185" y="226" width="150" height="36" rx="8" fill="#16a34a" opacity="0.75"/>
  <text x="260" y="249" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white" font-weight="600">Imprimir página</text>
  <text x="260" y="261" text-anchor="middle" font-family="sans-serif" font-size="9" fill="white">de prueba</text>
  <!-- Side notes -->
  <rect x="15" y="102" width="155" height="100" rx="8" fill="white" opacity="0.7" stroke="#0284c7" stroke-opacity="0.2"/>
  <text x="92" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0b66c3" font-weight="600">Tipos de conexión</text>
  <text x="30" y="138" font-family="sans-serif" font-size="9.5" fill="#475569">• USB (Plug and Play)</text>
  <text x="30" y="153" font-family="sans-serif" font-size="9.5" fill="#475569">• Red (TCP/IP, puerto 9100)</text>
  <text x="30" y="168" font-family="sans-serif" font-size="9.5" fill="#475569">• Wi-Fi (WPS o manual)</text>
  <text x="30" y="183" font-family="sans-serif" font-size="9.5" fill="#475569">• Bluetooth</text>
  <text x="30" y="198" font-family="sans-serif" font-size="9.5" fill="#475569">• Cloud Print</text>
  <rect x="350" y="102" width="155" height="100" rx="8" fill="white" opacity="0.7" stroke="#0284c7" stroke-opacity="0.2"/>
  <text x="427" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0b66c3" font-weight="600">Parámetros clave</text>
  <text x="365" y="138" font-family="sans-serif" font-size="9.5" fill="#475569">• Resolución (DPI)</text>
  <text x="365" y="153" font-family="sans-serif" font-size="9.5" fill="#475569">• Orientación (retrato/paisaje)</text>
  <text x="365" y="168" font-family="sans-serif" font-size="9.5" fill="#475569">• Cola de impresión</text>
  <text x="365" y="183" font-family="sans-serif" font-size="9.5" fill="#475569">• Compartir en red</text>
  <text x="365" y="198" font-family="sans-serif" font-size="9.5" fill="#475569">• Permisos de usuario</text>
  <!-- Troubleshoot -->
  <rect x="15" y="218" width="490" height="105" rx="8" fill="#fff7ed" stroke="#d97706" stroke-opacity="0.3"/>
  <text x="260" y="237" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309" font-weight="700">Problemas comunes y soluciones</text>
  <text x="30" y="255" font-family="sans-serif" font-size="9.5" fill="#78350f">• Sin conexión: verificar cable/Wi-Fi, reiniciar spooler (services.msc)</text>
  <text x="30" y="270" font-family="sans-serif" font-size="9.5" fill="#78350f">• Imprime en blanco: revisar cartuchos, limpiar cabezales</text>
  <text x="30" y="285" font-family="sans-serif" font-size="9.5" fill="#78350f">• Cola atascada: net stop spooler → borrar C:\Windows\System32\spool\PRINTERS → net start spooler</text>
  <text x="30" y="300" font-family="sans-serif" font-size="9.5" fill="#78350f">• Calidad baja: calibrar desde propiedades, aumentar DPI</text>
  <text x="30" y="315" font-family="sans-serif" font-size="9.5" fill="#78350f">• No detecta: reinstalar driver, probar otro puerto USB</text>
</svg>
