<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="520" height="340" fill="#fffbeb" rx="12"/>
  <text x="260" y="25" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b45309" font-weight="700">Mantenimiento y Optimización de Impresoras</text>
  <rect x="15" y="38" width="230" height="140" rx="10" fill="#fef3c7" stroke="#d97706" stroke-opacity="0.35"/>
  <text x="130" y="57" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309" font-weight="700">🔧 Mantenimiento Preventivo</text>
  <text x="28" y="75" font-family="sans-serif" font-size="9.5" fill="#78350f">• Limpiar cabezales (inkjet mensual)</text>
  <text x="28" y="91" font-family="sans-serif" font-size="9.5" fill="#78350f">• Revisar y limpiar rodillos</text>
  <text x="28" y="107" font-family="sans-serif" font-size="9.5" fill="#78350f">• Sacar papel de la bandeja si no se usa</text>
  <text x="28" y="123" font-family="sans-serif" font-size="9.5" fill="#78350f">• Revisar niveles de tinta/tóner</text>
  <text x="28" y="139" font-family="sans-serif" font-size="9.5" fill="#78350f">• Limpiar con paño seco el exterior</text>
  <text x="28" y="155" font-family="sans-serif" font-size="9.5" fill="#78350f">• Actualizar drivers periódicamente</text>
  <text x="28" y="170" font-family="sans-serif" font-size="9.5" fill="#78350f">• Registrar historial de páginas impresas</text>
  <rect x="275" y="38" width="230" height="140" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-opacity="0.35"/>
  <text x="390" y="57" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d" font-weight="700">⚙️ Optimización</text>
  <text x="288" y="75" font-family="sans-serif" font-size="9.5" fill="#14532d">• Ajustar modo de impresión (borrador vs. alta)</text>
  <text x="288" y="91" font-family="sans-serif" font-size="9.5" fill="#14532d">• Usar modo dúplex para ahorrar papel</text>
  <text x="288" y="107" font-family="sans-serif" font-size="9.5" fill="#14532d">• Configurar prioridades de cola</text>
  <text x="288" y="123" font-family="sans-serif" font-size="9.5" fill="#14532d">• Usar el tamaño de papel correcto</text>
  <text x="288" y="139" font-family="sans-serif" font-size="9.5" fill="#14532d">• Activar modo ahorro de tóner</text>
  <text x="288" y="155" font-family="sans-serif" font-size="9.5" fill="#14532d">• Imprimir en lotes (no una a una)</text>
  <text x="288" y="170" font-family="sans-serif" font-size="9.5" fill="#14532d">• Monitorear desde panel de control</text>
  <!-- Troubleshooting table -->
  <rect x="15" y="192" width="490" height="135" rx="10" fill="white" opacity="0.75" stroke="#d97706" stroke-opacity="0.25"/>
  <text x="260" y="211" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309" font-weight="700">Diagnóstico de problemas comunes</text>
  <rect x="15" y="216" width="490" height="1" fill="#e2e8f0"/>
  <text x="95" y="232" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b" font-weight="600">Síntoma</text>
  <text x="310" y="232" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b" font-weight="600">Causa probable</text>
  <text x="460" y="232" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b" font-weight="600">Solución</text>
  <text x="25" y="250" font-family="sans-serif" font-size="9" fill="#475569">Página en blanco</text>
  <text x="200" y="250" font-family="sans-serif" font-size="9" fill="#475569">Tinta agotada / cabezal obstruido</text>
  <text x="400" y="250" font-family="sans-serif" font-size="9" fill="#475569">Cambiar/limpiar</text>
  <text x="25" y="266" font-family="sans-serif" font-size="9" fill="#475569">Líneas horizontales</text>
  <text x="200" y="266" font-family="sans-serif" font-size="9" fill="#475569">Cabezal sucio o dañado</text>
  <text x="400" y="266" font-family="sans-serif" font-size="9" fill="#475569">Limpieza de cabezal</text>
  <text x="25" y="282" font-family="sans-serif" font-size="9" fill="#475569">Papel atascado</text>
  <text x="200" y="282" font-family="sans-serif" font-size="9" fill="#475569">Rodillos sucios, papel incorrecto</text>
  <text x="400" y="282" font-family="sans-serif" font-size="9" fill="#475569">Limpiar, usar papel correcto</text>
  <text x="25" y="298" font-family="sans-serif" font-size="9" fill="#475569">Impresión muy lenta</text>
  <text x="200" y="298" font-family="sans-serif" font-size="9" fill="#475569">DPI muy alto, cola saturada</text>
  <text x="400" y="298" font-family="sans-serif" font-size="9" fill="#475569">Reducir DPI, limpiar cola</text>
  <text x="25" y="314" font-family="sans-serif" font-size="9" fill="#475569">No imprime en red</text>
  <text x="200" y="314" font-family="sans-serif" font-size="9" fill="#475569">Firewall, driver, permisos</text>
  <text x="400" y="314" font-family="sans-serif" font-size="9" fill="#475569">Verificar reglas y permisos</text>
</svg>
