<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="520" height="340" fill="#f5f3ff" rx="12"/>
  <text x="260" y="25" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#7c3aed" font-weight="700">VirtualBox — Entorno del Caso Práctico</text>
  <!-- Host machine -->
  <rect x="30" y="40" width="460" height="255" rx="12" fill="#e9d5ff" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="2"/>
  <text x="260" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b21a8" font-weight="700">Máquina Host (tu PC física)</text>
  <!-- VM 1 -->
  <rect x="50" y="72" width="195" height="160" rx="8" fill="white" stroke="#7c3aed" stroke-opacity="0.4"/>
  <rect x="50" y="72" width="195" height="22" rx="8" fill="#7c3aed" opacity="0.7"/>
  <text x="148" y="87" text-anchor="middle" font-family="sans-serif" font-size="9" fill="white" font-weight="600">VM 1 — Windows 10 (servidor)</text>
  <text x="65" y="110" font-family="sans-serif" font-size="9" fill="#475569">• Impresora compartida instalada</text>
  <text x="65" y="125" font-family="sans-serif" font-size="9" fill="#475569">• Spooler activo</text>
  <text x="65" y="140" font-family="sans-serif" font-size="9" fill="#475569">• IP: 192.168.56.10</text>
  <text x="65" y="155" font-family="sans-serif" font-size="9" fill="#475569">• Recursos compartidos activos</text>
  <text x="65" y="170" font-family="sans-serif" font-size="9" fill="#475569">• Firewall configurado</text>
  <text x="65" y="190" font-family="sans-serif" font-size="8.5" fill="#7c3aed" font-weight="600">RAM: 2GB | Disco: 40GB</text>
  <text x="65" y="205" font-family="sans-serif" font-size="8.5" fill="#7c3aed" font-weight="600">Red: Host-only Adapter</text>
  <!-- VM 2 -->
  <rect x="275" y="72" width="195" height="160" rx="8" fill="white" stroke="#0b66c3" stroke-opacity="0.4"/>
  <rect x="275" y="72" width="195" height="22" rx="8" fill="#0b66c3" opacity="0.7"/>
  <text x="372" y="87" text-anchor="middle" font-family="sans-serif" font-size="9" fill="white" font-weight="600">VM 2 — Windows 10 (cliente)</text>
  <text x="290" y="110" font-family="sans-serif" font-size="9" fill="#475569">• Se conecta a impresora de VM1</text>
  <text x="290" y="125" font-family="sans-serif" font-size="9" fill="#475569">• IP: 192.168.56.11</text>
  <text x="290" y="140" font-family="sans-serif" font-size="9" fill="#475569">• Mismo grupo de trabajo</text>
  <text x="290" y="155" font-family="sans-serif" font-size="9" fill="#475569">• Driver instalado desde red</text>
  <text x="290" y="170" font-family="sans-serif" font-size="9" fill="#475569">• Prueba de impresión remota</text>
  <text x="290" y="190" font-family="sans-serif" font-size="8.5" fill="#0b66c3" font-weight="600">RAM: 2GB | Disco: 40GB</text>
  <text x="290" y="205" font-family="sans-serif" font-size="8.5" fill="#0b66c3" font-weight="600">Red: Host-only Adapter</text>
  <!-- Network arrow between VMs -->
  <line x1="245" y1="152" x2="275" y2="152" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="5,3"/>
  <polygon points="270,148 280,152 270,156" fill="#16a34a"/>
  <text x="260" y="148" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#16a34a" font-weight="600">Red virtual</text>
  <!-- Bottom bar -->
  <rect x="50" y="255" width="420" height="28" rx="6" fill="#7c3aed" opacity="0.1"/>
  <text x="260" y="273" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b21a8" font-weight="600">Red Host-Only: 192.168.56.0/24 — Aislada del exterior</text>
</svg>
