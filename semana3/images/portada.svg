<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf1f8"/><stop offset="100%" style="stop-color:#cfdceb"/>
    </linearGradient>
    <linearGradient id="win" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b66c3"/><stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bg)" rx="16"/>
  <!-- Windows logo stylized -->
  <rect x="50" y="60" width="72" height="72" rx="8" fill="#0b66c3" opacity="0.9"/>
  <rect x="132" y="60" width="72" height="72" rx="8" fill="#0ea5e9" opacity="0.9"/>
  <rect x="50" y="142" width="72" height="72" rx="8" fill="#16a34a" opacity="0.9"/>
  <rect x="132" y="142" width="72" height="72" rx="8" fill="#d97706" opacity="0.9"/>
  <!-- Labels inside squares -->
  <text x="86" y="103" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">Panel</text>
  <text x="86" y="116" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">Control</text>
  <text x="168" y="103" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">Usuarios</text>
  <text x="168" y="116" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">y Cuentas</text>
  <text x="86" y="185" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">Herram.</text>
  <text x="86" y="198" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">Admin.</text>
  <text x="168" y="185" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">CLI</text>
  <text x="168" y="198" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">Comandos</text>
  <!-- Right side content -->
  <rect x="240" y="50" width="230" height="55" rx="10" fill="rgba(11,102,195,.09)" stroke="rgba(11,102,195,.25)" stroke-width="1"/>
  <text x="255" y="70" font-family="sans-serif" font-size="10" font-weight="700" fill="#0a4f96">🖥 Sistema Operativo Windows</text>
  <text x="255" y="84" font-family="sans-serif" font-size="9" fill="#50607a">Escritorio · Explorador · Task Manager</text>
  <text x="255" y="97" font-family="sans-serif" font-size="9" fill="#50607a">Panel de Control · Configuración</text>
  <rect x="240" y="115" width="230" height="55" rx="10" fill="rgba(22,163,74,.09)" stroke="rgba(22,163,74,.25)" stroke-width="1"/>
  <text x="255" y="135" font-family="sans-serif" font-size="10" font-weight="700" fill="#16a34a">🔧 Herramientas Administrativas</text>
  <text x="255" y="149" font-family="sans-serif" font-size="9" fill="#50607a">Administrador de tareas · Servicios</text>
  <text x="255" y="162" font-family="sans-serif" font-size="9" fill="#50607a">Visor de eventos · Directiva de grupo</text>
  <rect x="240" y="180" width="230" height="55" rx="10" fill="rgba(217,119,6,.09)" stroke="rgba(217,119,6,.25)" stroke-width="1"/>
  <text x="255" y="200" font-family="sans-serif" font-size="10" font-weight="700" fill="#d97706">⌨️ Comandos CLI esenciales</text>
  <text x="255" y="214" font-family="sans-serif" font-size="9" fill="#50607a">ipconfig · netstat · sfc · diskpart</text>
  <text x="255" y="227" font-family="sans-serif" font-size="9" fill="#50607a">ping · tracert · net · tasklist</text>
  <!-- Bottom bar -->
  <rect x="30" y="255" width="440" height="42" rx="8" fill="rgba(255,255,255,.55)" stroke="rgba(11,102,195,.15)" stroke-width="1"/>
  <text x="250" y="273" font-family="sans-serif" font-size="11" font-weight="800" fill="#0a4f96" text-anchor="middle">Sistema Operativo Windows · Redes Windows</text>
  <text x="250" y="288" font-family="sans-serif" font-size="9.5" fill="#50607a" text-anchor="middle">TI-313 · Semana 3 — Universidad CENFOTEC</text>
</svg>
