<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf1f8"/><stop offset="100%" style="stop-color:#cfdceb"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bg)" rx="16"/>
  <text x="250" y="22" font-family="sans-serif" font-size="13" font-weight="800" fill="#0a4f96" text-anchor="middle">Instalacion de Apps y Gestion de Discos</text>
  <!-- Left: apps -->
  <rect x="15" y="32" width="225" height="85" rx="9" fill="rgba(11,102,195,.08)" stroke="rgba(11,102,195,.22)" stroke-width="1.5"/>
  <text x="25" y="49" font-family="sans-serif" font-size="10" font-weight="800" fill="#0a4f96">Instalar aplicaciones</text>
  <text x="25" y="62" font-family="sans-serif" font-size="8.5" fill="#50607a">1. Descargar instalador (.exe / .msi)</text>
  <text x="25" y="74" font-family="sans-serif" font-size="8.5" fill="#50607a">2. Ejecutar como Administrador</text>
  <text x="25" y="86" font-family="sans-serif" font-size="8.5" fill="#50607a">3. Aceptar UAC (Control de Cuentas)</text>
  <text x="25" y="98" font-family="sans-serif" font-size="8.5" fill="#50607a">4. Seguir asistente de instalacion</text>
  <text x="25" y="110" font-family="sans-serif" font-size="8.5" fill="#50607a">5. Reiniciar si se solicita</text>
  <rect x="15" y="124" width="225" height="80" rx="9" fill="rgba(220,38,38,.07)" stroke="rgba(220,38,38,.2)" stroke-width="1.5"/>
  <text x="25" y="141" font-family="sans-serif" font-size="10" font-weight="800" fill="#dc2626">Desinstalar aplicaciones</text>
  <text x="25" y="154" font-family="sans-serif" font-size="8.5" fill="#50607a">Panel de Control → Programas → Desinstalar</text>
  <text x="25" y="166" font-family="sans-serif" font-size="8.5" fill="#50607a">Configuracion → Aplicaciones</text>
  <text x="25" y="178" font-family="sans-serif" font-size="8.5" fill="#50607a">Cmd: wmic product get name</text>
  <text x="25" y="190" font-family="monospace" font-size="8" fill="#0a4f96">appwiz.cpl (Win+R)</text>
  <!-- Right: disk -->
  <rect x="253" y="32" width="232" height="80" rx="9" fill="rgba(22,163,74,.08)" stroke="rgba(22,163,74,.22)" stroke-width="1.5"/>
  <text x="263" y="49" font-family="sans-serif" font-size="10" font-weight="800" fill="#16a34a">Administracion de discos</text>
  <text x="263" y="62" font-family="sans-serif" font-size="8.5" fill="#50607a">diskmgmt.msc → ver particiones</text>
  <text x="263" y="74" font-family="sans-serif" font-size="8.5" fill="#50607a">Crear · Eliminar · Formatear particion</text>
  <text x="263" y="86" font-family="sans-serif" font-size="8.5" fill="#50607a">Extender / Reducir volumen</text>
  <text x="263" y="98" font-family="sans-serif" font-size="8.5" fill="#50607a">Cambiar letra de unidad</text>
  <text x="263" y="110" font-family="monospace" font-size="8" fill="#0a4f96">diskpart (CLI avanzado)</text>
  <!-- Diskpart commands -->
  <rect x="253" y="120" width="232" height="82" rx="9" fill="rgba(217,119,6,.07)" stroke="rgba(217,119,6,.2)" stroke-width="1.5"/>
  <text x="263" y="137" font-family="sans-serif" font-size="10" font-weight="800" fill="#d97706">diskpart - Comandos clave</text>
  <text x="263" y="150" font-family="monospace" font-size="8.5" fill="#50607a">list disk / list volume</text>
  <text x="263" y="162" font-family="monospace" font-size="8.5" fill="#50607a">select disk 1</text>
  <text x="263" y="174" font-family="monospace" font-size="8.5" fill="#50607a">create partition primary</text>
  <text x="263" y="186" font-family="monospace" font-size="8.5" fill="#50607a">format fs=ntfs quick</text>
  <text x="263" y="198" font-family="monospace" font-size="8.5" fill="#50607a">assign letter=D</text>
  <!-- Bottom: File systems + chkdsk -->
  <rect x="15" y="215" width="225" height="92" rx="8" fill="rgba(255,255,255,.6)" stroke="rgba(11,102,195,.15)" stroke-width="1"/>
  <text x="127" y="232" font-family="sans-serif" font-size="10" font-weight="800" fill="#0a4f96" text-anchor="middle">Sistemas de archivos</text>
  <text x="25" y="247" font-family="sans-serif" font-size="8.5" fill="#50607a">NTFS: permisos, cifrado, grandes archivos</text>
  <text x="25" y="259" font-family="sans-serif" font-size="8.5" fill="#50607a">FAT32: compatible, max archivo 4 GB</text>
  <text x="25" y="271" font-family="sans-serif" font-size="8.5" fill="#50607a">exFAT: USB/SD grandes sin limite 4 GB</text>
  <text x="25" y="283" font-family="sans-serif" font-size="9" fill="#0a4f96" font-weight="700">Verificacion y reparacion:</text>
  <text x="25" y="295" font-family="monospace" font-size="8.5" fill="#50607a">chkdsk C: /f /r</text>
  <text x="25" y="304" font-family="monospace" font-size="8.5" fill="#50607a">sfc /scannow</text>
  <!-- Bottom right -->
  <rect x="253" y="213" width="232" height="95" rx="8" fill="rgba(255,255,255,.6)" stroke="rgba(11,102,195,.15)" stroke-width="1"/>
  <text x="369" y="230" font-family="sans-serif" font-size="10" font-weight="800" fill="#0a4f96" text-anchor="middle">Actualizaciones Windows</text>
  <text x="263" y="244" font-family="sans-serif" font-size="8.5" fill="#50607a">Configuracion → Windows Update</text>
  <text x="263" y="256" font-family="sans-serif" font-size="8.5" fill="#50607a">Tipos: Seguridad, Acumulativas, Feature</text>
  <text x="263" y="268" font-family="sans-serif" font-size="8.5" fill="#50607a">Ver historial: Ver actualizaciones instaladas</text>
  <text x="263" y="280" font-family="sans-serif" font-size="8.5" fill="#50607a">Desinstalar actualizacion problematica</text>
  <text x="263" y="294" font-family="monospace" font-size="8.5" fill="#0a4f96">wuauclt /detectnow</text>
  <text x="263" y="304" font-family="monospace" font-size="8.5" fill="#50607a">usoclient StartScan</text>
</svg>
