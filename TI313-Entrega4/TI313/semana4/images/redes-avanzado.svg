<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf1f8"/><stop offset="100%" style="stop-color:#cfdceb"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bg)" rx="16"/>
  <text x="250" y="22" font-family="sans-serif" font-size="13" font-weight="800" fill="#0a4f96" text-anchor="middle">Redes de Windows — Acceso Remoto Avanzado</text>
  <!-- RDP -->
  <rect x="15" y="32" width="225" height="120" rx="9" fill="rgba(11,102,195,.08)" stroke="rgba(11,102,195,.25)" stroke-width="1.5"/>
  <text x="25" y="50" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0a4f96">🖥 RDP — Escritorio Remoto</text>
  <text x="25" y="63" font-family="monospace" font-size="8.5" fill="#50607a">Puerto: TCP 3389</text>
  <text x="25" y="75" font-family="sans-serif" font-size="8.5" fill="#50607a">Habilitar: sysdm.cpl → Acceso remoto</text>
  <text x="25" y="87" font-family="sans-serif" font-size="8.5" fill="#50607a">Cliente: mstsc → IP → Conectar</text>
  <text x="25" y="99" font-family="sans-serif" font-size="8.5" fill="#50607a">Firewall: regla "Escritorio remoto"</text>
  <text x="25" y="111" font-family="sans-serif" font-size="8.5" fill="#50607a">Solo usuarios con contraseña</text>
  <text x="25" y="128" font-family="monospace" font-size="8" fill="#0b66c3">netstat -an | findstr 3389</text>
  <text x="25" y="140" font-family="sans-serif" font-size="8" fill="#16a34a" font-weight="700">→ Debe aparecer LISTENING</text>
  <!-- SSH -->
  <rect x="260" y="32" width="225" height="120" rx="9" fill="rgba(22,163,74,.08)" stroke="rgba(22,163,74,.25)" stroke-width="1.5"/>
  <text x="270" y="50" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#16a34a">🔒 SSH — Secure Shell</text>
  <text x="270" y="63" font-family="monospace" font-size="8.5" fill="#50607a">Puerto: TCP 22</text>
  <text x="270" y="75" font-family="sans-serif" font-size="8.5" fill="#50607a">Windows 10+: OpenSSH incluido</text>
  <text x="270" y="87" font-family="sans-serif" font-size="8.5" fill="#50607a">Habilitar: Configuracion → Apps opcionales</text>
  <text x="270" y="99" font-family="sans-serif" font-size="8.5" fill="#50607a">Servidor: OpenSSH Server</text>
  <text x="270" y="111" font-family="sans-serif" font-size="8.5" fill="#50607a">Cliente: ssh usuario@IP</text>
  <text x="270" y="128" font-family="monospace" font-size="8" fill="#16a34a">ssh AdminTI@192.168.56.10</text>
  <text x="270" y="140" font-family="sans-serif" font-size="8" fill="#16a34a" font-weight="700">→ Cifrado fuerte, ideal servidores</text>
  <!-- Compartir avanzado -->
  <rect x="15" y="164" width="225" height="140" rx="9" fill="rgba(217,119,6,.08)" stroke="rgba(217,119,6,.22)" stroke-width="1.5"/>
  <text x="25" y="182" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#d97706">📁 Compartir avanzado</text>
  <text x="25" y="196" font-family="sans-serif" font-size="8.5" fill="#50607a">Deteccion de redes: activar en Red privada</text>
  <text x="25" y="208" font-family="sans-serif" font-size="8.5" fill="#50607a">Uso compartido con contrasena: activar</text>
  <text x="25" y="220" font-family="sans-serif" font-size="8.5" fill="#50607a">Carpetas administrativas ocultas:</text>
  <text x="25" y="232" font-family="monospace" font-size="8.5" fill="#0a4f96">\\IP\C$  ← disco C oculto</text>
  <text x="25" y="244" font-family="monospace" font-size="8.5" fill="#0a4f96">\\IP\Admin$  ← carpeta Windows</text>
  <text x="25" y="256" font-family="sans-serif" font-size="8.5" fill="#50607a">Ver recursos compartidos activos:</text>
  <text x="25" y="268" font-family="monospace" font-size="8.5" fill="#0a4f96">net share</text>
  <text x="25" y="284" font-family="sans-serif" font-size="8.5" fill="#50607a">Desconectar sesiones remotas:</text>
  <text x="25" y="296" font-family="monospace" font-size="8.5" fill="#0a4f96">net session  · net session /delete</text>
  <!-- Troubleshooting red -->
  <rect x="260" y="164" width="225" height="140" rx="9" fill="rgba(220,38,38,.07)" stroke="rgba(220,38,38,.2)" stroke-width="1.5"/>
  <text x="270" y="182" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#dc2626">🔧 Diagnóstico de red completo</text>
  <text x="270" y="196" font-family="monospace" font-size="8.5" fill="#50607a">ping 127.0.0.1</text>
  <text x="340" y="196" font-family="sans-serif" font-size="8" fill="#50607a">← NIC funciona</text>
  <text x="270" y="210" font-family="monospace" font-size="8.5" fill="#50607a">ping 192.168.56.1</text>
  <text x="340" y="210" font-family="sans-serif" font-size="8" fill="#50607a">← gateway OK</text>
  <text x="270" y="224" font-family="monospace" font-size="8.5" fill="#50607a">ping 8.8.8.8</text>
  <text x="340" y="224" font-family="sans-serif" font-size="8" fill="#50607a">← internet OK</text>
  <text x="270" y="238" font-family="monospace" font-size="8.5" fill="#50607a">ping google.com</text>
  <text x="340" y="238" font-family="sans-serif" font-size="8" fill="#50607a">← DNS OK</text>
  <text x="270" y="254" font-family="monospace" font-size="8.5" fill="#50607a">tracert 8.8.8.8</text>
  <text x="270" y="266" font-family="sans-serif" font-size="8" fill="#50607a">→ Muestra cada salto hasta destino</text>
  <text x="270" y="280" font-family="monospace" font-size="8.5" fill="#50607a">netsh winsock reset</text>
  <text x="270" y="292" font-family="sans-serif" font-size="8" fill="#50607a">→ Reparar pila TCP/IP corrompida</text>
  <text x="270" y="304" font-family="monospace" font-size="8.5" fill="#50607a">ipconfig /flushdns /release /renew</text>
</svg>
