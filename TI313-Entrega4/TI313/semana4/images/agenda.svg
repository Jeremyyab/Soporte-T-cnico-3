<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf1f8"/><stop offset="100%" style="stop-color:#cfdceb"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bg)" rx="16"/>
  <line x1="60" y1="50" x2="60" y2="298" stroke="#0b66c3" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- A -->
  <circle cx="60" cy="65" r="14" fill="#16a34a"/>
  <text x="60" y="70" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">A</text>
  <rect x="85" y="46" width="390" height="52" rx="8" fill="rgba(22,163,74,.1)" stroke="rgba(22,163,74,.3)" stroke-width="1"/>
  <text x="100" y="64" font-family="sans-serif" font-size="11" font-weight="800" fill="#16a34a">📖 Bloque A — Teoria (48 min)</text>
  <text x="100" y="78" font-family="sans-serif" font-size="9.5" fill="#50607a">Mantenimiento preventivo del SO · Backup y restauracion</text>
  <text x="100" y="91" font-family="sans-serif" font-size="9.5" fill="#50607a">BSOD y solucion de problemas avanzada · Modo seguro</text>
  <!-- Receso -->
  <circle cx="60" cy="125" r="14" fill="#94a3b8"/>
  <text x="60" y="130" font-family="sans-serif" font-size="9" font-weight="800" fill="white" text-anchor="middle">☕</text>
  <rect x="85" y="109" width="390" height="28" rx="8" fill="rgba(148,163,184,.15)" stroke="rgba(148,163,184,.4)" stroke-width="1"/>
  <text x="100" y="127" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#64748b">Receso — 10 minutos</text>
  <!-- B - Proyecto -->
  <circle cx="60" cy="175" r="14" fill="#dc2626"/>
  <text x="60" y="180" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">B</text>
  <rect x="85" y="156" width="390" height="55" rx="8" fill="rgba(220,38,38,.08)" stroke="rgba(220,38,38,.25)" stroke-width="1.5"/>
  <text x="100" y="174" font-family="sans-serif" font-size="11" font-weight="800" fill="#dc2626">🏆 Bloque B — Entrega del Proyecto (96 min)</text>
  <text x="100" y="188" font-family="sans-serif" font-size="9.5" fill="#50607a">Cada grupo presenta su proyecto DataTec S.A. (10 min + 5 min preguntas)</text>
  <text x="100" y="202" font-family="sans-serif" font-size="9.5" fill="#50607a">Demostracion en VirtualBox · Defensa tecnica oral · 55% del curso</text>
  <!-- C -->
  <circle cx="60" cy="250" r="14" fill="#0b66c3"/>
  <text x="60" y="255" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">C</text>
  <rect x="85" y="232" width="390" height="48" rx="8" fill="rgba(11,102,195,.08)" stroke="rgba(11,102,195,.25)" stroke-width="1"/>
  <text x="100" y="250" font-family="sans-serif" font-size="11" font-weight="800" fill="#0a4f96">💬 Bloque C — Retro y cierre del curso (40 min)</text>
  <text x="100" y="264" font-family="sans-serif" font-size="9.5" fill="#50607a">Retroalimentacion grupal · Cierre de la asignatura</text>
  <text x="100" y="277" font-family="sans-serif" font-size="9.5" fill="#50607a">Tramite de insignias digitales y notas finales</text>
  <!-- Badge -->
  <rect x="30" y="296" width="90" height="18" rx="9" fill="rgba(220,38,38,.12)" stroke="rgba(220,38,38,.3)" stroke-width="1"/>
  <text x="75" y="308" font-family="sans-serif" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">⭐ Ultima clase</text>
</svg>
