<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf1f8"/><stop offset="100%" style="stop-color:#cfdceb"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bg)" rx="16"/>
  <text x="250" y="22" font-family="sans-serif" font-size="13" font-weight="800" fill="#0a4f96" text-anchor="middle">Backup y Restauracion del Sistema</text>
  <!-- Backup options top row -->
  <rect x="15" y="32" width="145" height="110" rx="9" fill="rgba(22,163,74,.08)" stroke="rgba(22,163,74,.25)" stroke-width="1.5"/>
  <text x="87" y="51" font-family="sans-serif" font-size="10" font-weight="800" fill="#16a34a" text-anchor="middle">Historial de archivos</text>
  <text x="25" y="66" font-family="sans-serif" font-size="8.5" fill="#50607a">Panel Control → Historial</text>
  <text x="25" y="78" font-family="sans-serif" font-size="8.5" fill="#50607a">Requiere disco externo</text>
  <text x="25" y="90" font-family="sans-serif" font-size="8.5" fill="#50607a">Versiones de archivos</text>
  <text x="25" y="102" font-family="sans-serif" font-size="8.5" fill="#50607a">Restaurar versiones prev.</text>
  <text x="25" y="114" font-family="sans-serif" font-size="8.5" fill="#50607a">Clic derecho → Restaurar</text>
  <text x="25" y="128" font-family="sans-serif" font-size="8" fill="#16a34a" font-weight="700">→ Protege documentos</text>
  <rect x="170" y="32" width="145" height="110" rx="9" fill="rgba(11,102,195,.08)" stroke="rgba(11,102,195,.22)" stroke-width="1.5"/>
  <text x="242" y="51" font-family="sans-serif" font-size="10" font-weight="800" fill="#0a4f96" text-anchor="middle">Copia de seguridad</text>
  <text x="180" y="66" font-family="sans-serif" font-size="8.5" fill="#50607a">Configuracion → Actualiz.</text>
  <text x="180" y="78" font-family="sans-serif" font-size="8.5" fill="#50607a">→ Opciones de recuperacion</text>
  <text x="180" y="90" font-family="sans-serif" font-size="8.5" fill="#50607a">wbadmin (cmd avanzado)</text>
  <text x="180" y="102" font-family="sans-serif" font-size="8.5" fill="#50607a">Imagen del sistema: todo</text>
  <text x="180" y="114" font-family="sans-serif" font-size="8.5" fill="#50607a">el disco (SO + datos)</text>
  <text x="180" y="128" font-family="sans-serif" font-size="8" fill="#0b66c3" font-weight="700">→ Restauracion completa</text>
  <rect x="325" y="32" width="160" height="110" rx="9" fill="rgba(217,119,6,.08)" stroke="rgba(217,119,6,.22)" stroke-width="1.5"/>
  <text x="405" y="51" font-family="sans-serif" font-size="10" font-weight="800" fill="#d97706" text-anchor="middle">Punto de restauracion</text>
  <text x="335" y="66" font-family="sans-serif" font-size="8.5" fill="#50607a">sysdm.cpl → Proteccion</text>
  <text x="335" y="78" font-family="sans-serif" font-size="8.5" fill="#50607a">Crear punto manual</text>
  <text x="335" y="90" font-family="sans-serif" font-size="8.5" fill="#50607a">Windows los crea solo</text>
  <text x="335" y="102" font-family="sans-serif" font-size="8.5" fill="#50607a">antes de actualizaciones</text>
  <text x="335" y="114" font-family="sans-serif" font-size="8.5" fill="#50607a">Restaurar: rstrui.exe</text>
  <text x="335" y="128" font-family="sans-serif" font-size="8" fill="#d97706" font-weight="700">→ NO recupera archivos</text>
  <!-- Arrow recovery flow -->
  <rect x="15" y="155" width="470" height="150" rx="10" fill="rgba(255,255,255,.55)" stroke="rgba(11,102,195,.15)" stroke-width="1"/>
  <text x="250" y="172" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0a4f96" text-anchor="middle">Opciones de recuperacion avanzada de Windows</text>
  <!-- Option flow -->
  <rect x="25" y="180" width="95" height="38" rx="6" fill="rgba(22,163,74,.12)" stroke="rgba(22,163,74,.3)" stroke-width="1"/>
  <text x="72" y="196" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#16a34a" text-anchor="middle">Restablecer PC</text>
  <text x="72" y="208" font-family="sans-serif" font-size="7.5" fill="#50607a" text-anchor="middle">Conservar o quitar</text>
  <text x="72" y="218" font-family="sans-serif" font-size="7.5" fill="#50607a" text-anchor="middle">archivos personales</text>
  <line x1="120" y1="199" x2="135" y2="199" stroke="#0b66c3" stroke-width="1.5"/>
  <polygon points="133,195 140,199 133,203" fill="#0b66c3"/>
  <rect x="140" y="180" width="95" height="38" rx="6" fill="rgba(11,102,195,.1)" stroke="rgba(11,102,195,.25)" stroke-width="1"/>
  <text x="187" y="196" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#0a4f96" text-anchor="middle">Reparar arranque</text>
  <text x="187" y="208" font-family="sans-serif" font-size="7.5" fill="#50607a" text-anchor="middle">Bootmgr / BCD</text>
  <text x="187" y="218" font-family="sans-serif" font-size="7.5" fill="#50607a" text-anchor="middle">bootrec /fixmbr</text>
  <line x1="235" y1="199" x2="250" y2="199" stroke="#0b66c3" stroke-width="1.5"/>
  <polygon points="248,195 255,199 248,203" fill="#0b66c3"/>
  <rect x="255" y="180" width="95" height="38" rx="6" fill="rgba(217,119,6,.1)" stroke="rgba(217,119,6,.25)" stroke-width="1"/>
  <text x="302" y="196" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#d97706" text-anchor="middle">Modo seguro</text>
  <text x="302" y="208" font-family="sans-serif" font-size="7.5" fill="#50607a" text-anchor="middle">F8 / msconfig</text>
  <text x="302" y="218" font-family="sans-serif" font-size="7.5" fill="#50607a" text-anchor="middle">Solo drivers basicos</text>
  <line x1="350" y1="199" x2="365" y2="199" stroke="#0b66c3" stroke-width="1.5"/>
  <polygon points="363,195 370,199 363,203" fill="#0b66c3"/>
  <rect x="370" y="180" width="100" height="38" rx="6" fill="rgba(220,38,38,.1)" stroke="rgba(220,38,38,.22)" stroke-width="1"/>
  <text x="420" y="196" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">Recuperacion SO</text>
  <text x="420" y="208" font-family="sans-serif" font-size="7.5" fill="#50607a" text-anchor="middle">Disco de recuperacion</text>
  <text x="420" y="218" font-family="sans-serif" font-size="7.5" fill="#50607a" text-anchor="middle">ISO de Windows</text>
  <!-- Acceso -->
  <text x="250" y="242" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0a4f96" text-anchor="middle">Acceso: Configuracion → Sistema → Recuperacion → Inicio avanzado</text>
  <text x="250" y="256" font-family="sans-serif" font-size="9.5" fill="#50607a" text-anchor="middle">o: Shift + Reiniciar → Solucionar problemas → Opciones avanzadas</text>
  <!-- Regla 3-2-1 -->
  <rect x="25" y="265" width="445" height="30" rx="7" fill="rgba(22,163,74,.1)" stroke="rgba(22,163,74,.25)" stroke-width="1"/>
  <text x="247" y="278" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#16a34a" text-anchor="middle">Regla 3-2-1 del backup</text>
  <text x="247" y="290" font-family="sans-serif" font-size="9" fill="#50607a" text-anchor="middle">3 copias · en 2 medios diferentes · 1 copia fuera del sitio (nube o disco externo en otro lugar)</text>
</svg>
