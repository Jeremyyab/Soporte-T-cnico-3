<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf1f8"/>
      <stop offset="100%" style="stop-color:#cfdceb"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bg)" rx="16"/>
  <text x="250" y="22" font-family="sans-serif" font-size="13" font-weight="800" fill="#0a4f96" text-anchor="middle">Modos de Red en VirtualBox</text>
  <!-- NAT -->
  <rect x="15" y="35" width="108" height="115" rx="8" fill="rgba(11,102,195,0.08)" stroke="rgba(11,102,195,0.3)" stroke-width="1.5"/>
  <rect x="15" y="35" width="108" height="22" rx="8" fill="rgba(11,102,195,0.7)"/>
  <rect x="15" y="47" width="108" height="10" rx="0" fill="rgba(11,102,195,0.7)"/>
  <text x="69" y="51" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">NAT</text>
  <text x="20" y="72" font-family="sans-serif" font-size="8.5" fill="#50607a">VM → Internet ✅</text>
  <text x="20" y="84" font-family="sans-serif" font-size="8.5" fill="#50607a">Host → VM ❌</text>
  <text x="20" y="96" font-family="sans-serif" font-size="8.5" fill="#50607a">VM ↔ VM ❌</text>
  <text x="20" y="108" font-family="sans-serif" font-size="8.5" fill="#0a4f96" font-weight="700">IP: 10.0.2.x</text>
  <rect x="20" y="116" width="98" height="26" rx="5" fill="rgba(11,102,195,0.1)"/>
  <text x="69" y="128" font-family="sans-serif" font-size="8" fill="#0a4f96" text-anchor="middle">Usar para: acceso</text>
  <text x="69" y="139" font-family="sans-serif" font-size="8" fill="#0a4f96" text-anchor="middle">a internet básico</text>

  <!-- Bridged -->
  <rect x="132" y="35" width="108" height="115" rx="8" fill="rgba(22,163,74,0.08)" stroke="rgba(22,163,74,0.3)" stroke-width="1.5"/>
  <rect x="132" y="35" width="108" height="22" rx="8" fill="rgba(22,163,74,0.75)"/>
  <rect x="132" y="47" width="108" height="10" rx="0" fill="rgba(22,163,74,0.75)"/>
  <text x="186" y="51" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">Bridged</text>
  <text x="137" y="72" font-family="sans-serif" font-size="8.5" fill="#50607a">VM → Internet ✅</text>
  <text x="137" y="84" font-family="sans-serif" font-size="8.5" fill="#50607a">Host → VM ✅</text>
  <text x="137" y="96" font-family="sans-serif" font-size="8.5" fill="#50607a">VM ↔ VM ✅</text>
  <text x="137" y="108" font-family="sans-serif" font-size="8.5" fill="#0a4f96" font-weight="700">IP real de la red</text>
  <rect x="137" y="116" width="98" height="26" rx="5" fill="rgba(22,163,74,0.1)"/>
  <text x="186" y="128" font-family="sans-serif" font-size="8" fill="#16a34a" text-anchor="middle">Usar para: labs con</text>
  <text x="186" y="139" font-family="sans-serif" font-size="8" fill="#16a34a" text-anchor="middle">acceso completo</text>

  <!-- Host-Only -->
  <rect x="249" y="35" width="108" height="115" rx="8" fill="rgba(217,119,6,0.08)" stroke="rgba(217,119,6,0.3)" stroke-width="1.5"/>
  <rect x="249" y="35" width="108" height="22" rx="8" fill="rgba(217,119,6,0.75)"/>
  <rect x="249" y="47" width="108" height="10" rx="0" fill="rgba(217,119,6,0.75)"/>
  <text x="303" y="51" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">Host-Only</text>
  <text x="254" y="72" font-family="sans-serif" font-size="8.5" fill="#50607a">VM → Internet ❌</text>
  <text x="254" y="84" font-family="sans-serif" font-size="8.5" fill="#50607a">Host → VM ✅</text>
  <text x="254" y="96" font-family="sans-serif" font-size="8.5" fill="#50607a">VM ↔ VM ✅</text>
  <text x="254" y="108" font-family="sans-serif" font-size="8.5" fill="#0a4f96" font-weight="700">IP: 192.168.56.x</text>
  <rect x="254" y="116" width="98" height="26" rx="5" fill="rgba(217,119,6,0.1)"/>
  <text x="303" y="128" font-family="sans-serif" font-size="8" fill="#d97706" text-anchor="middle">⭐ Usar en CP2</text>
  <text x="303" y="139" font-family="sans-serif" font-size="8" fill="#d97706" text-anchor="middle">Red interna + host</text>

  <!-- Internal -->
  <rect x="366" y="35" width="108" height="115" rx="8" fill="rgba(220,38,38,0.08)" stroke="rgba(220,38,38,0.25)" stroke-width="1.5"/>
  <rect x="366" y="35" width="108" height="22" rx="8" fill="rgba(220,38,38,0.65)"/>
  <rect x="366" y="47" width="108" height="10" rx="0" fill="rgba(220,38,38,0.65)"/>
  <text x="420" y="51" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">Internal</text>
  <text x="371" y="72" font-family="sans-serif" font-size="8.5" fill="#50607a">VM → Internet ❌</text>
  <text x="371" y="84" font-family="sans-serif" font-size="8.5" fill="#50607a">Host → VM ❌</text>
  <text x="371" y="96" font-family="sans-serif" font-size="8.5" fill="#50607a">VM ↔ VM ✅</text>
  <text x="371" y="108" font-family="sans-serif" font-size="8.5" fill="#0a4f96" font-weight="700">Sin DHCP auto</text>
  <rect x="371" y="116" width="98" height="26" rx="5" fill="rgba(220,38,38,0.08)"/>
  <text x="420" y="128" font-family="sans-serif" font-size="8" fill="#dc2626" text-anchor="middle">Solo VMs entre sí</text>
  <text x="420" y="139" font-family="sans-serif" font-size="8" fill="#dc2626" text-anchor="middle">sin host</text>

  <!-- Config diagram -->
  <rect x="15" y="162" width="460" height="145" rx="10" fill="rgba(255,255,255,0.55)" stroke="rgba(11,102,195,0.15)" stroke-width="1"/>
  <text x="245" y="180" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0a4f96" text-anchor="middle">⭐ Configuración para el CP2 — Dos adaptadores por VM</text>
  <!-- Adapter 1 -->
  <rect x="25" y="188" width="205" height="48" rx="7" fill="rgba(217,119,6,0.08)" stroke="rgba(217,119,6,0.25)" stroke-width="1"/>
  <text x="127" y="204" font-family="sans-serif" font-size="9.5" fill="#d97706" text-anchor="middle" font-weight="700">Adaptador 1: Host-Only</text>
  <text x="127" y="217" font-family="sans-serif" font-size="9" fill="#50607a" text-anchor="middle">192.168.56.x — Comunicación entre VMs</text>
  <text x="127" y="230" font-family="sans-serif" font-size="9" fill="#50607a" text-anchor="middle">y con el host para el laboratorio</text>
  <!-- Adapter 2 -->
  <rect x="240" y="188" width="225" height="48" rx="7" fill="rgba(11,102,195,0.08)" stroke="rgba(11,102,195,0.25)" stroke-width="1"/>
  <text x="352" y="204" font-family="sans-serif" font-size="9.5" fill="#0b66c3" text-anchor="middle" font-weight="700">Adaptador 2: NAT</text>
  <text x="352" y="217" font-family="sans-serif" font-size="9" fill="#50607a" text-anchor="middle">10.0.2.x — Acceso a internet</text>
  <text x="352" y="230" font-family="sans-serif" font-size="9" fill="#50607a" text-anchor="middle">para descargar drivers y actualizaciones</text>
  <!-- Ping test -->
  <rect x="25" y="246" width="440" height="50" rx="7" fill="rgba(22,163,74,0.06)" stroke="rgba(22,163,74,0.2)" stroke-width="1"/>
  <text x="35" y="262" font-family="sans-serif" font-size="9.5" fill="#16a34a" font-weight="700">Verificación de conectividad</text>
  <text x="35" y="275" font-family="sans-serif" font-size="9" fill="#50607a">VM1 → CMD → ping 192.168.56.11   (VM2 responde)</text>
  <text x="35" y="288" font-family="sans-serif" font-size="9" fill="#50607a">VM2 → CMD → ping 192.168.56.10   (VM1 responde) → ✅ Red funcionando</text>
</svg>
