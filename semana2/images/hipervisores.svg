<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf1f8"/>
      <stop offset="100%" style="stop-color:#cfdceb"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bg)" rx="16"/>
  <!-- Title -->
  <text x="250" y="30" font-family="sans-serif" font-size="13" font-weight="800" fill="#0a4f96" text-anchor="middle">Tipos de Hipervisor</text>
  <!-- Tipo 1 -->
  <rect x="30" y="45" width="210" height="200" rx="12" fill="rgba(11,102,195,0.08)" stroke="rgba(11,102,195,0.3)" stroke-width="1.5"/>
  <text x="135" y="68" font-family="sans-serif" font-size="12" font-weight="800" fill="#0b66c3" text-anchor="middle">Tipo 1 — Bare-metal</text>
  <rect x="45" y="78" width="180" height="22" rx="5" fill="rgba(22,163,74,0.7)"/>
  <text x="135" y="93" font-family="sans-serif" font-size="9.5" fill="white" text-anchor="middle" font-weight="700">VMs</text>
  <rect x="45" y="107" width="180" height="22" rx="5" fill="rgba(11,102,195,0.75)"/>
  <text x="135" y="122" font-family="sans-serif" font-size="9.5" fill="white" text-anchor="middle" font-weight="700">Hipervisor (directo sobre HW)</text>
  <rect x="45" y="136" width="180" height="22" rx="5" fill="rgba(10,79,150,0.85)"/>
  <text x="135" y="151" font-family="sans-serif" font-size="9.5" fill="white" text-anchor="middle" font-weight="700">Hardware Físico</text>
  <text x="45" y="174" font-family="sans-serif" font-size="9" fill="#50607a">Ejemplos:</text>
  <text x="45" y="186" font-family="sans-serif" font-size="9" fill="#50607a">• VMware ESXi</text>
  <text x="45" y="198" font-family="sans-serif" font-size="9" fill="#50607a">• Microsoft Hyper-V Server</text>
  <text x="45" y="210" font-family="sans-serif" font-size="9" fill="#50607a">• Xen / KVM</text>
  <rect x="45" y="220" width="180" height="18" rx="9" fill="rgba(22,163,74,0.15)" stroke="rgba(22,163,74,0.35)" stroke-width="1"/>
  <text x="135" y="232" font-family="sans-serif" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="700">✅ Mejor rendimiento · Producción</text>
  <!-- Tipo 2 -->
  <rect x="260" y="45" width="210" height="200" rx="12" fill="rgba(217,119,6,0.08)" stroke="rgba(217,119,6,0.3)" stroke-width="1.5"/>
  <text x="365" y="68" font-family="sans-serif" font-size="12" font-weight="800" fill="#d97706" text-anchor="middle">Tipo 2 — Hosted</text>
  <rect x="275" y="78" width="180" height="22" rx="5" fill="rgba(22,163,74,0.7)"/>
  <text x="365" y="93" font-family="sans-serif" font-size="9.5" fill="white" text-anchor="middle" font-weight="700">VMs (Guest OS)</text>
  <rect x="275" y="107" width="180" height="22" rx="5" fill="rgba(217,119,6,0.8)"/>
  <text x="365" y="122" font-family="sans-serif" font-size="9.5" fill="white" text-anchor="middle" font-weight="700">Hipervisor (app del host)</text>
  <rect x="275" y="136" width="180" height="22" rx="5" fill="rgba(11,102,195,0.6)"/>
  <text x="365" y="151" font-family="sans-serif" font-size="9.5" fill="white" text-anchor="middle" font-weight="700">Sistema Operativo Host</text>
  <rect x="275" y="165" width="180" height="14" rx="5" fill="rgba(10,79,150,0.75)"/>
  <text x="365" y="175" font-family="sans-serif" font-size="8.5" fill="white" text-anchor="middle" font-weight="700">Hardware Físico</text>
  <text x="275" y="196" font-family="sans-serif" font-size="9" fill="#50607a">Ejemplos:</text>
  <text x="275" y="208" font-family="sans-serif" font-size="9" fill="#50607a">• VirtualBox (Oracle) ← usamos este</text>
  <text x="275" y="220" font-family="sans-serif" font-size="9" fill="#50607a">• VMware Workstation / Fusion</text>
  <rect x="275" y="228" width="180" height="18" rx="9" fill="rgba(11,102,195,0.1)" stroke="rgba(11,102,195,0.3)" stroke-width="1"/>
  <text x="365" y="240" font-family="sans-serif" font-size="9" fill="#0b66c3" text-anchor="middle" font-weight="700">✅ Fácil instalación · Laboratorios</text>
  <!-- Bottom note -->
  <rect x="30" y="260" width="440" height="42" rx="8" fill="rgba(255,255,255,0.6)" stroke="rgba(11,102,195,0.15)" stroke-width="1"/>
  <text x="250" y="278" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0a4f96" text-anchor="middle">En este curso usamos VirtualBox (Tipo 2)</text>
  <text x="250" y="293" font-family="sans-serif" font-size="9.5" fill="#50607a" text-anchor="middle">Gratuito · Open source · Disponible para Windows, macOS y Linux</text>
</svg>
