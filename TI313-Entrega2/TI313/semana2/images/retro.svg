<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf1f8"/>
      <stop offset="100%" style="stop-color:#cfdceb"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bg)" rx="16"/>
  <text x="250" y="26" font-family="sans-serif" font-size="13" font-weight="800" fill="#0a4f96" text-anchor="middle">Retroalimentación — Semana 2</text>
  <rect x="30" y="38" width="440" height="60" rx="10" fill="rgba(22,163,74,0.1)" stroke="rgba(22,163,74,0.3)" stroke-width="1.5"/>
  <text x="40" y="57" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#16a34a">✅ Preguntas de revisión grupal</text>
  <text x="40" y="71" font-family="sans-serif" font-size="9.5" fill="#50607a">1. ¿Pudieron instalar Windows sin errores? ¿Qué dificultad encontraron?</text>
  <text x="40" y="85" font-family="sans-serif" font-size="9.5" fill="#50607a">2. ¿Qué modo de red usaron y por qué funciona para el lab?</text>
  <!-- Cards -->
  <rect x="30" y="108" width="205" height="88" rx="8" fill="rgba(11,102,195,0.07)" stroke="rgba(11,102,195,0.2)" stroke-width="1"/>
  <text x="40" y="124" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0a4f96">3. Diferencia Tipo 1 vs Tipo 2</text>
  <text x="40" y="138" font-family="sans-serif" font-size="9" fill="#50607a">¿Cuándo usaría cada uno</text>
  <text x="40" y="150" font-family="sans-serif" font-size="9" fill="#50607a">en un entorno real?</text>
  <text x="40" y="168" font-family="sans-serif" font-size="8.5" fill="#0b66c3">→ Tipo 1: datacenter/producción</text>
  <text x="40" y="180" font-family="sans-serif" font-size="8.5" fill="#0b66c3">→ Tipo 2: lab/aprendizaje</text>

  <rect x="245" y="108" width="225" height="88" rx="8" fill="rgba(217,119,6,0.07)" stroke="rgba(217,119,6,0.2)" stroke-width="1"/>
  <text x="255" y="124" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#d97706">4. IaaS / PaaS / SaaS</text>
  <text x="255" y="138" font-family="sans-serif" font-size="9" fill="#50607a">¿Qué modelo usa Google Drive?</text>
  <text x="255" y="150" font-family="sans-serif" font-size="9" fill="#50607a">¿Y un servidor alquilado en AWS?</text>
  <text x="255" y="168" font-family="sans-serif" font-size="8.5" fill="#d97706">→ Google Drive: SaaS</text>
  <text x="255" y="180" font-family="sans-serif" font-size="8.5" fill="#d97706">→ AWS EC2: IaaS</text>

  <rect x="30" y="205" width="205" height="80" rx="8" fill="rgba(22,163,74,0.07)" stroke="rgba(22,163,74,0.2)" stroke-width="1"/>
  <text x="40" y="221" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#16a34a">5. Snapshots</text>
  <text x="40" y="235" font-family="sans-serif" font-size="9" fill="#50607a">¿Por qué es buena práctica</text>
  <text x="40" y="247" font-family="sans-serif" font-size="9" fill="#50607a">tomar snapshot antes de</text>
  <text x="40" y="259" font-family="sans-serif" font-size="9" fill="#50607a">instalar un software nuevo?</text>
  <text x="40" y="275" font-family="sans-serif" font-size="8.5" fill="#16a34a">→ Punto de restauración seguro</text>

  <rect x="245" y="205" width="225" height="80" rx="8" fill="rgba(11,102,195,0.07)" stroke="rgba(11,102,195,0.2)" stroke-width="1"/>
  <text x="255" y="221" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0a4f96">6. Verificación final</text>
  <text x="255" y="235" font-family="sans-serif" font-size="9" fill="#50607a">¿El ping entre VM1 y VM2</text>
  <text x="255" y="247" font-family="sans-serif" font-size="9" fill="#50607a">funcionó? ¿Qué verificaron</text>
  <text x="255" y="259" font-family="sans-serif" font-size="9" fill="#50607a">si no respondió?</text>
  <text x="255" y="275" font-family="sans-serif" font-size="8.5" fill="#0b66c3">→ Firewall, modo red, IP</text>

  <!-- Note avance proyecto -->
  <rect x="30" y="295" width="440" height="18" rx="7" fill="rgba(11,102,195,0.1)" stroke="rgba(11,102,195,0.25)" stroke-width="1"/>
  <text x="250" y="307" font-family="sans-serif" font-size="9" fill="#0a4f96" text-anchor="middle" font-weight="700">📌 Recordatorio: 10 horas de avance del proyecto esta semana</text>
</svg>
