<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf1f8"/>
      <stop offset="100%" style="stop-color:#cfdceb"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bg)" rx="16"/>
  <!-- Left: Boot sequence -->
  <text x="120" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#0a4f96" text-anchor="middle">Secuencia de Arranque</text>
  <!-- Steps -->
  <rect x="20" y="30" width="200" height="30" rx="7" fill="rgba(11,102,195,0.85)"/>
  <text x="120" y="50" font-family="sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">1. POST (Power-On Self Test)</text>
  <line x1="120" y1="60" x2="120" y2="72" stroke="#0b66c3" stroke-width="2"/>
  <polygon points="114,70 120,78 126,70" fill="#0b66c3"/>

  <rect x="20" y="78" width="200" height="30" rx="7" fill="rgba(14,165,233,0.8)"/>
  <text x="120" y="98" font-family="sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">2. BIOS / UEFI</text>
  <line x1="120" y1="108" x2="120" y2="120" stroke="#0ea5e9" stroke-width="2"/>
  <polygon points="114,118 120,126 126,118" fill="#0ea5e9"/>

  <rect x="20" y="126" width="200" height="30" rx="7" fill="rgba(217,119,6,0.8)"/>
  <text x="120" y="146" font-family="sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">3. MBR / GPT (Boot Loader)</text>
  <line x1="120" y1="156" x2="120" y2="168" stroke="#d97706" stroke-width="2"/>
  <polygon points="114,166 120,174 126,166" fill="#d97706"/>

  <rect x="20" y="174" width="200" height="30" rx="7" fill="rgba(22,163,74,0.8)"/>
  <text x="120" y="194" font-family="sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">4. Bootmgr / GRUB</text>
  <line x1="120" y1="204" x2="120" y2="216" stroke="#16a34a" stroke-width="2"/>
  <polygon points="114,214 120,222 126,214" fill="#16a34a"/>

  <rect x="20" y="222" width="200" height="30" rx="7" fill="rgba(10,79,150,0.85)"/>
  <text x="120" y="242" font-family="sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">5. Kernel del SO</text>
  <line x1="120" y1="252" x2="120" y2="264" stroke="#0a4f96" stroke-width="2"/>
  <polygon points="114,262 120,270 126,262" fill="#0a4f96"/>

  <rect x="20" y="270" width="200" height="30" rx="7" fill="rgba(11,102,195,0.65)"/>
  <text x="120" y="290" font-family="sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">6. Escritorio / Login</text>

  <!-- Right: Disk admin -->
  <text x="370" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#0a4f96" text-anchor="middle">Administración de Discos</text>
  <rect x="250" y="30" width="230" height="55" rx="8" fill="rgba(11,102,195,0.08)" stroke="rgba(11,102,195,0.2)" stroke-width="1"/>
  <text x="260" y="48" font-family="sans-serif" font-size="9.5" fill="#0a4f96" font-weight="700">MBR vs GPT</text>
  <text x="260" y="61" font-family="sans-serif" font-size="9" fill="#50607a">MBR: hasta 2 TB, 4 particiones primarias</text>
  <text x="260" y="75" font-family="sans-serif" font-size="9" fill="#50607a">GPT: hasta 9.4 ZB, 128 particiones</text>

  <rect x="250" y="93" width="230" height="68" rx="8" fill="rgba(22,163,74,0.08)" stroke="rgba(22,163,74,0.2)" stroke-width="1"/>
  <text x="260" y="110" font-family="sans-serif" font-size="9.5" fill="#16a34a" font-weight="700">Tipos de disco virtual (VDI)</text>
  <text x="260" y="123" font-family="sans-serif" font-size="9" fill="#50607a">Dinámico: crece según uso real</text>
  <text x="260" y="136" font-family="sans-serif" font-size="9" fill="#50607a">Fijo: ocupa todo el espacio desde inicio</text>
  <text x="260" y="149" font-family="sans-serif" font-size="9" fill="#50607a">Diferenciante (linked clone)</text>

  <rect x="250" y="169" width="230" height="68" rx="8" fill="rgba(217,119,6,0.08)" stroke="rgba(217,119,6,0.2)" stroke-width="1"/>
  <text x="260" y="186" font-family="sans-serif" font-size="9.5" fill="#d97706" font-weight="700">Particionado Windows</text>
  <text x="260" y="199" font-family="sans-serif" font-size="9" fill="#50607a">Partición del sistema (EFI 100 MB)</text>
  <text x="260" y="212" font-family="sans-serif" font-size="9" fill="#50607a">Partición de recuperación (WinRE)</text>
  <text x="260" y="225" font-family="sans-serif" font-size="9" fill="#50607a">Partición C: (sistema operativo)</text>

  <rect x="250" y="245" width="230" height="55" rx="8" fill="rgba(11,102,195,0.08)" stroke="rgba(11,102,195,0.2)" stroke-width="1"/>
  <text x="260" y="262" font-family="sans-serif" font-size="9.5" fill="#0a4f96" font-weight="700">Herramientas Windows</text>
  <text x="260" y="275" font-family="sans-serif" font-size="9" fill="#50607a">diskmgmt.msc · diskpart · Administración</text>
  <text x="260" y="288" font-family="sans-serif" font-size="9" fill="#50607a">de discos → clic derecho → formatear</text>
</svg>
