<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf1f8"/>
      <stop offset="100%" style="stop-color:#cfdceb"/>
    </linearGradient>
    <linearGradient id="hw" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a4f96"/>
      <stop offset="100%" style="stop-color:#0b66c3"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bg)" rx="16"/>
  <!-- Stack diagram -->
  <!-- Hardware -->
  <rect x="60" y="255" width="380" height="38" rx="8" fill="url(#hw)"/>
  <text x="250" y="275" font-family="sans-serif" font-size="12" font-weight="800" fill="white" text-anchor="middle">🖥 HARDWARE FÍSICO</text>
  <text x="250" y="288" font-family="sans-serif" font-size="9.5" fill="rgba(255,255,255,0.75)" text-anchor="middle">CPU · RAM · Disco · Red</text>
  <!-- Hypervisor -->
  <rect x="60" y="207" width="380" height="38" rx="8" fill="rgba(14,165,233,0.85)"/>
  <text x="250" y="227" font-family="sans-serif" font-size="12" font-weight="800" fill="white" text-anchor="middle">⚙️ HIPERVISOR (VirtualBox / VMware)</text>
  <text x="250" y="240" font-family="sans-serif" font-size="9.5" fill="rgba(255,255,255,0.85)" text-anchor="middle">Tipo 1 (bare-metal) · Tipo 2 (hosted)</text>
  <!-- VM1 -->
  <rect x="60" y="130" width="178" height="68" rx="8" fill="rgba(22,163,74,0.88)"/>
  <text x="149" y="150" font-family="sans-serif" font-size="11" font-weight="800" fill="white" text-anchor="middle">VM 1</text>
  <text x="149" y="164" font-family="sans-serif" font-size="9.5" fill="rgba(255,255,255,0.9)" text-anchor="middle">Windows 11</text>
  <text x="149" y="177" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.75)" text-anchor="middle">2 vCPU · 4 GB RAM · 50 GB</text>
  <text x="149" y="190" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.75)" text-anchor="middle">Disco: VDI dinámico</text>
  <!-- VM2 -->
  <rect x="262" y="130" width="178" height="68" rx="8" fill="rgba(217,119,6,0.88)"/>
  <text x="351" y="150" font-family="sans-serif" font-size="11" font-weight="800" fill="white" text-anchor="middle">VM 2</text>
  <text x="351" y="164" font-family="sans-serif" font-size="9.5" fill="rgba(255,255,255,0.9)" text-anchor="middle">Windows 10</text>
  <text x="351" y="177" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.75)" text-anchor="middle">2 vCPU · 2 GB RAM · 40 GB</text>
  <text x="351" y="190" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.75)" text-anchor="middle">Disco: VDI fijo</text>
  <!-- Apps -->
  <rect x="60" y="80" width="178" height="40" rx="6" fill="rgba(11,102,195,0.15)" stroke="rgba(11,102,195,0.35)" stroke-width="1"/>
  <text x="149" y="100" font-family="sans-serif" font-size="10" fill="#0a4f96" text-anchor="middle" font-weight="700">Apps Guest OS 1</text>
  <text x="149" y="113" font-family="sans-serif" font-size="9" fill="#50607a" text-anchor="middle">Office · Notepad · CMD</text>
  <rect x="262" y="80" width="178" height="40" rx="6" fill="rgba(11,102,195,0.15)" stroke="rgba(11,102,195,0.35)" stroke-width="1"/>
  <text x="351" y="100" font-family="sans-serif" font-size="10" fill="#0a4f96" text-anchor="middle" font-weight="700">Apps Guest OS 2</text>
  <text x="351" y="113" font-family="sans-serif" font-size="9" fill="#50607a" text-anchor="middle">Tools · Browser · Antivirus</text>
  <!-- Aislamiento label -->
  <text x="250" y="38" font-family="sans-serif" font-size="13" font-weight="800" fill="#0a4f96" text-anchor="middle">Aislamiento entre VMs</text>
  <line x1="60" y1="44" x2="440" y2="44" stroke="#0b66c3" stroke-width="1.5" stroke-dasharray="5,4"/>
</svg>
