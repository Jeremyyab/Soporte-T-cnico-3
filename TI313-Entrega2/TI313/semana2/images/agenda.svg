<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf1f8"/>
      <stop offset="100%" style="stop-color:#cfdceb"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bg)" rx="16"/>
  <!-- Timeline line -->
  <line x1="60" y1="55" x2="60" y2="285" stroke="#0b66c3" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- Bloque A -->
  <circle cx="60" cy="70" r="14" fill="#16a34a"/>
  <text x="60" y="75" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">A</text>
  <rect x="85" y="52" width="390" height="52" rx="8" fill="rgba(22,163,74,0.1)" stroke="rgba(22,163,74,0.3)" stroke-width="1"/>
  <text x="100" y="70" font-family="sans-serif" font-size="11" font-weight="800" fill="#16a34a">📖 Bloque A — Teoría (48 min)</text>
  <text x="100" y="83" font-family="sans-serif" font-size="9.5" fill="#50607a">Virtualización del lado del cliente · Computación en la nube</text>
  <text x="100" y="96" font-family="sans-serif" font-size="9.5" fill="#50607a">Características del SO · Secuencia de arranque · Admin. de discos</text>
  <!-- Receso -->
  <circle cx="60" cy="130" r="14" fill="#94a3b8"/>
  <text x="60" y="135" font-family="sans-serif" font-size="9" font-weight="800" fill="white" text-anchor="middle">☕</text>
  <rect x="85" y="114" width="390" height="30" rx="8" fill="rgba(148,163,184,0.15)" stroke="rgba(148,163,184,0.4)" stroke-width="1"/>
  <text x="100" y="133" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#64748b">Receso — 10 minutos</text>
  <!-- Bloque B -->
  <circle cx="60" cy="180" r="14" fill="#d97706"/>
  <text x="60" y="185" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">B</text>
  <rect x="85" y="162" width="390" height="52" rx="8" fill="rgba(217,119,6,0.1)" stroke="rgba(217,119,6,0.3)" stroke-width="1"/>
  <text x="100" y="180" font-family="sans-serif" font-size="11" font-weight="800" fill="#d97706">🧪 Bloque B — Caso práctico 2 (96 min)</text>
  <text x="100" y="193" font-family="sans-serif" font-size="9.5" fill="#50607a">Instalación Windows en VirtualBox · Snapshots y clonación</text>
  <text x="100" y="206" font-family="sans-serif" font-size="9.5" fill="#50607a">Configuración básica del SO · Herramientas de administración</text>
  <!-- Bloque C -->
  <circle cx="60" cy="258" r="14" fill="#0b66c3"/>
  <text x="60" y="263" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">C</text>
  <rect x="85" y="240" width="390" height="38" rx="8" fill="rgba(11,102,195,0.08)" stroke="rgba(11,102,195,0.25)" stroke-width="1"/>
  <text x="100" y="258" font-family="sans-serif" font-size="11" font-weight="800" fill="#0a4f96">💬 Bloque C — Retro y cierre (40 min)</text>
  <text x="100" y="271" font-family="sans-serif" font-size="9.5" fill="#50607a">Revisión soluciones CP2 · Avance del proyecto</text>
  <!-- Total -->
  <rect x="30" y="296" width="90" height="18" rx="9" fill="rgba(11,102,195,0.12)" stroke="rgba(11,102,195,0.3)" stroke-width="1"/>
  <text x="75" y="308" font-family="sans-serif" font-size="9" font-weight="700" fill="#0a4f96" text-anchor="middle">⏱ 194 min</text>
