<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf1f8"/>
      <stop offset="100%" style="stop-color:#cfdceb"/>
    </linearGradient>
    <linearGradient id="iaas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    <linearGradient id="paas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
    <linearGradient id="saas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bg)" rx="16"/>
  <text x="250" y="28" font-family="sans-serif" font-size="13" font-weight="800" fill="#0a4f96" text-anchor="middle">Modelos de Servicio en la Nube</text>
  <!-- IaaS -->
  <rect x="25" y="42" width="140" height="230" rx="12" fill="rgba(220,38,38,0.08)" stroke="rgba(220,38,38,0.3)" stroke-width="1.5"/>
  <rect x="25" y="42" width="140" height="32" rx="12" fill="url(#iaas)"/>
  <rect x="25" y="58" width="140" height="16" rx="0" fill="url(#iaas)"/>
  <text x="95" y="63" font-family="sans-serif" font-size="12" font-weight="800" fill="white" text-anchor="middle">IaaS</text>
  <text x="95" y="78" font-family="sans-serif" font-size="9" fill="rgba(220,38,38,0.9)" text-anchor="middle" font-weight="600">Infraestructura como Servicio</text>
  <text x="35" y="102" font-family="sans-serif" font-size="9" fill="#50607a">Tú gestionas:</text>
  <text x="35" y="115" font-family="sans-serif" font-size="9" fill="#0a4f96">• SO, Middleware, Apps</text>
  <text x="35" y="128" font-family="sans-serif" font-size="9" fill="#50607a">Proveedor da:</text>
  <text x="35" y="141" font-family="sans-serif" font-size="9" fill="#50607a">• Servidores, redes, almac.</text>
  <line x1="35" y1="150" x2="155" y2="150" stroke="rgba(220,38,38,0.2)" stroke-width="1"/>
  <text x="35" y="166" font-family="sans-serif" font-size="9" fill="#50607a" font-weight="600">Ejemplos:</text>
  <text x="35" y="179" font-family="sans-serif" font-size="9" fill="#50607a">AWS EC2</text>
  <text x="35" y="192" font-family="sans-serif" font-size="9" fill="#50607a">Azure VMs</text>
  <text x="35" y="205" font-family="sans-serif" font-size="9" fill="#50607a">Google Compute</text>
  <rect x="35" y="218" width="115" height="42" rx="6" fill="rgba(220,38,38,0.08)"/>
  <text x="92" y="233" font-family="sans-serif" font-size="8.5" fill="#dc2626" text-anchor="middle" font-weight="700">Control total del SO</text>
  <text x="92" y="246" font-family="sans-serif" font-size="8" fill="#50607a" text-anchor="middle">Ideal: Sysadmins</text>
  <text x="92" y="258" font-family="sans-serif" font-size="8" fill="#50607a" text-anchor="middle">y DevOps</text>
  <!-- PaaS -->
  <rect x="180" y="42" width="140" height="230" rx="12" fill="rgba(217,119,6,0.08)" stroke="rgba(217,119,6,0.3)" stroke-width="1.5"/>
  <rect x="180" y="42" width="140" height="32" rx="12" fill="url(#paas)"/>
  <rect x="180" y="58" width="140" height="16" rx="0" fill="url(#paas)"/>
  <text x="250" y="63" font-family="sans-serif" font-size="12" font-weight="800" fill="white" text-anchor="middle">PaaS</text>
  <text x="250" y="78" font-family="sans-serif" font-size="9" fill="rgba(217,119,6,0.9)" text-anchor="middle" font-weight="600">Plataforma como Servicio</text>
  <text x="190" y="102" font-family="sans-serif" font-size="9" fill="#50607a">Tú gestionas:</text>
  <text x="190" y="115" font-family="sans-serif" font-size="9" fill="#0a4f96">• Solo tus aplicaciones</text>
  <text x="190" y="128" font-family="sans-serif" font-size="9" fill="#50607a">Proveedor da:</text>
  <text x="190" y="141" font-family="sans-serif" font-size="9" fill="#50607a">• SO, runtime, middleware</text>
  <line x1="190" y1="150" x2="310" y2="150" stroke="rgba(217,119,6,0.2)" stroke-width="1"/>
  <text x="190" y="166" font-family="sans-serif" font-size="9" fill="#50607a" font-weight="600">Ejemplos:</text>
  <text x="190" y="179" font-family="sans-serif" font-size="9" fill="#50607a">Google App Engine</text>
  <text x="190" y="192" font-family="sans-serif" font-size="9" fill="#50607a">Azure App Service</text>
  <text x="190" y="205" font-family="sans-serif" font-size="9" fill="#50607a">Heroku</text>
  <rect x="190" y="218" width="115" height="42" rx="6" fill="rgba(217,119,6,0.08)"/>
  <text x="247" y="233" font-family="sans-serif" font-size="8.5" fill="#d97706" text-anchor="middle" font-weight="700">Enfocado en código</text>
  <text x="247" y="246" font-family="sans-serif" font-size="8" fill="#50607a" text-anchor="middle">Ideal: Desarrolladores</text>
  <text x="247" y="258" font-family="sans-serif" font-size="8" fill="#50607a" text-anchor="middle">de software</text>
  <!-- SaaS -->
  <rect x="335" y="42" width="140" height="230" rx="12" fill="rgba(22,163,74,0.08)" stroke="rgba(22,163,74,0.3)" stroke-width="1.5"/>
  <rect x="335" y="42" width="140" height="32" rx="12" fill="url(#saas)"/>
  <rect x="335" y="58" width="140" height="16" rx="0" fill="url(#saas)"/>
  <text x="405" y="63" font-family="sans-serif" font-size="12" font-weight="800" fill="white" text-anchor="middle">SaaS</text>
  <text x="405" y="78" font-family="sans-serif" font-size="9" fill="rgba(22,163,74,0.9)" text-anchor="middle" font-weight="600">Software como Servicio</text>
  <text x="345" y="102" font-family="sans-serif" font-size="9" fill="#50607a">Tú usas:</text>
  <text x="345" y="115" font-family="sans-serif" font-size="9" fill="#0a4f96">• Solo la aplicación</text>
  <text x="345" y="128" font-family="sans-serif" font-size="9" fill="#50607a">Proveedor gestiona TODO:</text>
  <text x="345" y="141" font-family="sans-serif" font-size="9" fill="#50607a">• Infra, SO, apps, datos</text>
  <line x1="345" y1="150" x2="465" y2="150" stroke="rgba(22,163,74,0.2)" stroke-width="1"/>
  <text x="345" y="166" font-family="sans-serif" font-size="9" fill="#50607a" font-weight="600">Ejemplos:</text>
  <text x="345" y="179" font-family="sans-serif" font-size="9" fill="#50607a">Google Workspace</text>
  <text x="345" y="192" font-family="sans-serif" font-size="9" fill="#50607a">Microsoft 365</text>
  <text x="345" y="205" font-family="sans-serif" font-size="9" fill="#50607a">Zoom · Slack</text>
  <rect x="345" y="218" width="115" height="42" rx="6" fill="rgba(22,163,74,0.08)"/>
  <text x="402" y="233" font-family="sans-serif" font-size="8.5" fill="#16a34a" text-anchor="middle" font-weight="700">Sin instalación local</text>
  <text x="402" y="246" font-family="sans-serif" font-size="8" fill="#50607a" text-anchor="middle">Ideal: usuarios finales</text>
  <text x="402" y="258" font-family="sans-serif" font-size="8" fill="#50607a" text-anchor="middle">y empresas</text>
  <!-- Bottom -->
  <rect x="25" y="285" width="450" height="26" rx="8" fill="rgba(255,255,255,0.55)" stroke="rgba(11,102,195,0.15)" stroke-width="1"/>
  <text x="250" y="302" font-family="sans-serif" font-size="9.5" fill="#0a4f96" text-anchor="middle" font-weight="700">Pizza as a Service: IaaS = hacés la pizza | PaaS = piden entrega | SaaS = van al restaurante</text>
</svg>
