<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="520" height="340" fill="#faf5ff" rx="12"/>
  <text x="260" y="25" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#7c3aed" font-weight="700">Impresoras 3D y Virtuales</text>
  <!-- 3D Printer illustration -->
  <rect x="40" y="50" width="180" height="160" rx="10" fill="#e9d5ff" stroke="#7c3aed" stroke-opacity="0.4"/>
  <text x="130" y="75" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b21a8" font-weight="700">Impresora 3D</text>
  <!-- Frame -->
  <rect x="65" y="85" width="130" height="100" rx="4" fill="none" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Print head -->
  <rect x="95" y="90" width="30" height="15" rx="3" fill="#7c3aed" opacity="0.7"/>
  <line x1="110" y1="105" x2="110" y2="130" stroke="#f59e0b" stroke-width="2"/>
  <!-- Platform -->
  <rect x="75" y="165" width="110" height="8" rx="2" fill="#a78bfa"/>
  <!-- Object being printed -->
  <rect x="95" y="135" width="30" height="30" rx="3" fill="#c4b5fd" opacity="0.8"/>
  <!-- FDM types -->
  <text x="55" y="225" font-family="sans-serif" font-size="9.5" fill="#6b21a8" font-weight="600">Tecnologías:</text>
  <text x="55" y="240" font-family="sans-serif" font-size="9" fill="#475569">• FDM: Filamento fundido (más común)</text>
  <text x="55" y="255" font-family="sans-serif" font-size="9" fill="#475569">• SLA: Resina fotocurable (UV)</text>
  <text x="55" y="270" font-family="sans-serif" font-size="9" fill="#475569">• SLS: Polvo sinterizado con láser</text>
  <text x="55" y="285" font-family="sans-serif" font-size="9" fill="#475569">• Usos: Prototipos, piezas, medicina</text>
  <!-- Virtual Printer -->
  <rect x="290" y="50" width="200" height="160" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-opacity="0.4"/>
  <text x="390" y="75" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#075985" font-weight="700">Impresoras Virtuales</text>
  <text x="305" y="100" font-family="sans-serif" font-size="10" fill="#0284c7" font-weight="600">Microsoft Print to PDF</text>
  <text x="305" y="115" font-family="sans-serif" font-size="9" fill="#475569">Genera PDF desde cualquier app</text>
  <text x="305" y="138" font-family="sans-serif" font-size="10" fill="#0284c7" font-weight="600">Microsoft XPS</text>
  <text x="305" y="153" font-family="sans-serif" font-size="9" fill="#475569">Formato XPS de Microsoft</text>
  <text x="305" y="176" font-family="sans-serif" font-size="10" fill="#0284c7" font-weight="600">OneNote / Fax</text>
  <text x="305" y="191" font-family="sans-serif" font-size="9" fill="#475569">Integradas en Windows</text>
  <!-- Virtual concept -->
  <rect x="290" y="225" width="200" height="90" rx="8" fill="white" opacity="0.7" stroke="#0284c7" stroke-opacity="0.3"/>
  <text x="390" y="243" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#075985" font-weight="600">¿Cómo funciona?</text>
  <text x="305" y="260" font-family="sans-serif" font-size="9" fill="#475569">App envía trabajo → Driver virtual</text>
  <text x="305" y="275" font-family="sans-serif" font-size="9" fill="#475569">Driver convierte a formato digital</text>
  <text x="305" y="290" font-family="sans-serif" font-size="9" fill="#475569">Guarda como archivo (PDF/XPS)</text>
  <text x="305" y="305" font-family="sans-serif" font-size="9" fill="#475569">Sin papel ni tinta necesarios</text>
</svg>
