<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf1f8"/><stop offset="100%" style="stop-color:#cfdceb"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bg)" rx="16"/>
  <text x="250" y="22" font-family="sans-serif" font-size="13" font-weight="800" fill="#0a4f96" text-anchor="middle">Plan de Mantenimiento Preventivo del SO</text>
  <!-- Daily -->
  <rect x="15" y="32" width="110" height="130" rx="9" fill="rgba(22,163,74,.08)" stroke="rgba(22,163,74,.28)" stroke-width="1.5"/>
  <rect x="15" y="32" width="110" height="26" rx="9" fill="rgba(22,163,74,.6)"/>
  <rect x="15" y="48" width="110" height="10" fill="rgba(22,163,74,.6)"/>
  <text x="70" y="51" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">DIARIO</text>
  <text x="22" y="72" font-family="sans-serif" font-size="8.5" fill="#50607a">Cerrar sesion</text>
  <text x="22" y="84" font-family="sans-serif" font-size="8.5" fill="#50607a">Hacer logout</text>
  <text x="22" y="96" font-family="sans-serif" font-size="8.5" fill="#50607a">No dejar PC sin lock</text>
  <text x="22" y="108" font-family="sans-serif" font-size="8.5" fill="#50607a">Guardar trabajo</text>
  <text x="22" y="120" font-family="sans-serif" font-size="8.5" fill="#50607a">Verificar espacio C:</text>
  <text x="22" y="132" font-family="sans-serif" font-size="8.5" fill="#50607a">Antivirus activo</text>
  <text x="22" y="144" font-family="sans-serif" font-size="8.5" fill="#50607a">Actualiz. Windows</text>
  <text x="22" y="156" font-family="sans-serif" font-size="8.5" fill="#50607a">pendientes: revisar</text>
  <!-- Weekly -->
  <rect x="135" y="32" width="110" height="130" rx="9" fill="rgba(11,102,195,.08)" stroke="rgba(11,102,195,.25)" stroke-width="1.5"/>
  <rect x="135" y="32" width="110" height="26" rx="9" fill="rgba(11,102,195,.6)"/>
  <rect x="135" y="48" width="110" height="10" fill="rgba(11,102,195,.6)"/>
  <text x="190" y="51" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">SEMANAL</text>
  <text x="142" y="72" font-family="sans-serif" font-size="8.5" fill="#50607a">Limpiar escritorio</text>
  <text x="142" y="84" font-family="sans-serif" font-size="8.5" fill="#50607a">Vaciar papelera</text>
  <text x="142" y="96" font-family="sans-serif" font-size="8.5" fill="#50607a">Revisar Temp files</text>
  <text x="142" y="108" font-family="sans-serif" font-size="8.5" fill="#50607a">Ejecutar cleanmgr</text>
  <text x="142" y="120" font-family="sans-serif" font-size="8.5" fill="#50607a">Escanear antivirus</text>
  <text x="142" y="132" font-family="sans-serif" font-size="8.5" fill="#50607a">Revisar logs del SO</text>
  <text x="142" y="144" font-family="sans-serif" font-size="8.5" fill="#50607a">(eventvwr.msc)</text>
  <text x="142" y="156" font-family="sans-serif" font-size="8.5" fill="#50607a">Reiniciar el equipo</text>
  <!-- Monthly -->
  <rect x="255" y="32" width="110" height="130" rx="9" fill="rgba(217,119,6,.08)" stroke="rgba(217,119,6,.25)" stroke-width="1.5"/>
  <rect x="255" y="32" width="110" height="26" rx="9" fill="rgba(217,119,6,.6)"/>
  <rect x="255" y="48" width="110" height="10" fill="rgba(217,119,6,.6)"/>
  <text x="310" y="51" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">MENSUAL</text>
  <text x="262" y="72" font-family="sans-serif" font-size="8.5" fill="#50607a">Actualizar Windows</text>
  <text x="262" y="84" font-family="sans-serif" font-size="8.5" fill="#50607a">Actualizar drivers</text>
  <text x="262" y="96" font-family="sans-serif" font-size="8.5" fill="#50607a">Desfragmentar HDD</text>
  <text x="262" y="108" font-family="sans-serif" font-size="8.5" fill="#50607a">Verificar disco:</text>
  <text x="262" y="120" font-family="sans-serif" font-size="8.5" fill="#50607a">chkdsk /f</text>
  <text x="262" y="132" font-family="sans-serif" font-size="8.5" fill="#50607a">Crear punto</text>
  <text x="262" y="144" font-family="sans-serif" font-size="8.5" fill="#50607a">de restauracion</text>
  <text x="262" y="156" font-family="sans-serif" font-size="8.5" fill="#50607a">Verificar backups</text>
  <!-- Quarterly -->
  <rect x="375" y="32" width="110" height="130" rx="9" fill="rgba(220,38,38,.08)" stroke="rgba(220,38,38,.22)" stroke-width="1.5"/>
  <rect x="375" y="32" width="110" height="26" rx="9" fill="rgba(220,38,38,.55)"/>
  <rect x="375" y="48" width="110" height="10" fill="rgba(220,38,38,.55)"/>
  <text x="430" y="51" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">TRIMESTRAL</text>
  <text x="382" y="72" font-family="sans-serif" font-size="8.5" fill="#50607a">Limpiar hardware</text>
  <text x="382" y="84" font-family="sans-serif" font-size="8.5" fill="#50607a">(polvo, ventiladores)</text>
  <text x="382" y="96" font-family="sans-serif" font-size="8.5" fill="#50607a">Revisar temperatura</text>
  <text x="382" y="108" font-family="sans-serif" font-size="8.5" fill="#50607a">Auditar usuarios</text>
  <text x="382" y="120" font-family="sans-serif" font-size="8.5" fill="#50607a">Revisar licencias</text>
  <text x="382" y="132" font-family="sans-serif" font-size="8.5" fill="#50607a">sfc /scannow</text>
  <text x="382" y="144" font-family="sans-serif" font-size="8.5" fill="#50607a">Actualizar antivirus</text>
  <text x="382" y="156" font-family="sans-serif" font-size="8.5" fill="#50607a">Revisar particiones</text>
  <!-- Bottom: Tools -->
  <rect x="15" y="174" width="225" height="134" rx="10" fill="rgba(255,255,255,.6)" stroke="rgba(11,102,195,.15)" stroke-width="1"/>
  <text x="127" y="192" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0a4f96" text-anchor="middle">Herramientas de limpieza</text>
  <text x="25" y="208" font-family="monospace" font-size="9" fill="#50607a">cleanmgr</text>
  <text x="120" y="208" font-family="sans-serif" font-size="9" fill="#50607a">→ Liberador de espacio GUI</text>
  <text x="25" y="222" font-family="monospace" font-size="9" fill="#50607a">%temp%</text>
  <text x="120" y="222" font-family="sans-serif" font-size="9" fill="#50607a">→ Borrar archivos temp</text>
  <text x="25" y="236" font-family="monospace" font-size="9" fill="#50607a">prefetch</text>
  <text x="120" y="236" font-family="sans-serif" font-size="9" fill="#50607a">→ Limpiar caché arranque</text>
  <text x="25" y="250" font-family="monospace" font-size="9" fill="#50607a">defrag C: /U /V</text>
  <text x="120" y="250" font-family="sans-serif" font-size="9" fill="#50607a">→ Desfragmentar HDD</text>
  <text x="25" y="264" font-family="monospace" font-size="9" fill="#50607a">Optimize-Volume</text>
  <text x="120" y="264" font-family="sans-serif" font-size="9" fill="#50607a">→ PowerShell TRIM SSD</text>
  <text x="25" y="278" font-family="sans-serif" font-size="9" fill="#dc2626" font-weight="700">SSD: NO desfragmentar</text>
  <text x="25" y="290" font-family="sans-serif" font-size="9" fill="#50607a">usar solo TRIM (automatic)</text>
  <text x="25" y="302" font-family="sans-serif" font-size="9" fill="#50607a">Settings → Optimize Drives</text>
  <!-- Right bottom: inicio automatico -->
  <rect x="253" y="174" width="232" height="134" rx="10" fill="rgba(22,163,74,.07)" stroke="rgba(22,163,74,.2)" stroke-width="1"/>
  <text x="369" y="192" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#16a34a" text-anchor="middle">Optimizar arranque</text>
  <text x="263" y="208" font-family="sans-serif" font-size="9" fill="#50607a">Adm. Tareas → Inicio → Deshabilitar</text>
  <text x="263" y="220" font-family="sans-serif" font-size="9" fill="#50607a">apps innecesarias al arranque</text>
  <text x="263" y="232" font-family="monospace" font-size="9" fill="#0a4f96">msconfig → Inicio</text>
  <text x="263" y="248" font-family="sans-serif" font-size="9" fill="#50607a">Servicios: deshabilitar los no</text>
  <text x="263" y="260" font-family="sans-serif" font-size="9" fill="#50607a">necesarios en services.msc</text>
  <text x="263" y="276" font-family="sans-serif" font-size="9" fill="#0a4f96" font-weight="700">Regla: si no sabes que hace,</text>
  <text x="263" y="288" font-family="sans-serif" font-size="9" fill="#0a4f96" font-weight="700">no lo deshabilites</text>
  <text x="263" y="302" font-family="sans-serif" font-size="9" fill="#50607a">Plan de energia: Alto rendimiento</text>
</svg>
