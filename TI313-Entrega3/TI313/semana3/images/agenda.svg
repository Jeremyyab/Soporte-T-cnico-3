  <text x="60" y="257" font-family="sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">C</text>
  <rect x="85" y="234" width="390" height="38" rx="8" fill="rgba(11,102,195,.08)" stroke="rgba(11,102,195,.25)" stroke-width="1"/>
