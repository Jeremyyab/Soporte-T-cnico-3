<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf1f8"/><stop offset="100%" style="stop-color:#cfdceb"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bg)" rx="16"/>
  <!-- CMD window simulation -->
  <rect x="20" y="18" width="220" height="190" rx="8" fill="#0f172a"/>
  <rect x="20" y="18" width="220" height="22" rx="8" fill="#1e293b"/>
  <rect x="20" y="30" width="220" height="10" fill="#1e293b"/>
  <text x="120" y="32" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Símbolo del sistema</text>
  <circle cx="225" cy="27" r="5" fill="#dc2626" opacity="0.7"/>
  <!-- CMD content -->
  <text x="28" y="56" font-family="monospace" font-size="9" fill="#22c55e">C:\Users\Admin&gt; ipconfig</text>
  <text x="28" y="68" font-family="monospace" font-size="8" fill="#94a3b8">Adaptador Ethernet:</text>
  <text x="28" y="79" font-family="monospace" font-size="8" fill="#94a3b8">   IPv4: 192.168.56.10</text>
  <text x="28" y="90" font-family="monospace" font-size="8" fill="#94a3b8">   Máscara: 255.255.255.0</text>
  <text x="28" y="101" font-family="monospace" font-size="8" fill="#94a3b8">   Gateway: 192.168.56.1</text>
  <text x="28" y="115" font-family="monospace" font-size="9" fill="#22c55e">C:\&gt; ping 192.168.56.11</text>
  <text x="28" y="127" font-family="monospace" font-size="8" fill="#94a3b8">Respuesta desde 56.11:</text>
  <text x="28" y="138" font-family="monospace" font-size="8" fill="#94a3b8">bytes=32 tiempo=1ms TTL=128</text>
  <text x="28" y="149" font-family="monospace" font-size="8" fill="#94a3b8">bytes=32 tiempo&lt;1ms TTL=128</text>
  <text x="28" y="163" font-family="monospace" font-size="9" fill="#22c55e">C:\&gt; netstat -an</text>
  <text x="28" y="175" font-family="monospace" font-size="8" fill="#94a3b8">Proto  Dir. local   Estado</text>
  <text x="28" y="186" font-family="monospace" font-size="8" fill="#94a3b8">TCP    0.0.0.0:80  LISTENING</text>
  <text x="28" y="197" font-family="monospace" font-size="8" fill="#22c55e">C:\&gt; _</text>
  <!-- Right: command reference -->
  <text x="260" y="22" font-family="sans-serif" font-size="12" font-weight="800" fill="#0a4f96" text-anchor="middle">Comandos CLI Esenciales</text>
  <!-- Red -->
  <rect x="252" y="28" width="232" height="58" rx="7" fill="rgba(11,102,195,.08)" stroke="rgba(11,102,195,.2)" stroke-width="1"/>
  <text x="262" y="43" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#0a4f96">🌐 Red</text>
  <text x="262" y="55" font-family="monospace" font-size="8.5" fill="#50607a">ipconfig /all   · ipconfig /release</text>
  <text x="262" y="66" font-family="monospace" font-size="8.5" fill="#50607a">ipconfig /renew · ipconfig /flushdns</text>
  <text x="262" y="77" font-family="monospace" font-size="8.5" fill="#50607a">ping · tracert · nslookup · netstat</text>
  <!-- Sistema -->
  <rect x="252" y="92" width="232" height="58" rx="7" fill="rgba(22,163,74,.08)" stroke="rgba(22,163,74,.2)" stroke-width="1"/>
  <text x="262" y="107" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#16a34a">⚙️ Sistema</text>
  <text x="262" y="119" font-family="monospace" font-size="8.5" fill="#50607a">systeminfo · msinfo32 · winver</text>
  <text x="262" y="130" font-family="monospace" font-size="8.5" fill="#50607a">sfc /scannow  (reparar archivos SO)</text>
  <text x="262" y="141" font-family="monospace" font-size="8.5" fill="#50607a">DISM /Online /Cleanup-Image /RestoreHealth</text>
  <!-- Procesos -->
  <rect x="252" y="156" width="232" height="50" rx="7" fill="rgba(217,119,6,.08)" stroke="rgba(217,119,6,.2)" stroke-width="1"/>
  <text x="262" y="171" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#d97706">🔄 Procesos y tareas</text>
  <text x="262" y="183" font-family="monospace" font-size="8.5" fill="#50607a">tasklist · taskkill /PID &lt;id&gt; /F</text>
  <text x="262" y="194" font-family="monospace" font-size="8.5" fill="#50607a">net start · net stop · sc query</text>
  <!-- Disco -->
  <rect x="252" y="212" width="232" height="50" rx="7" fill="rgba(220,38,38,.08)" stroke="rgba(220,38,38,.2)" stroke-width="1"/>
  <text x="262" y="227" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#dc2626">💾 Disco y archivos</text>
  <text x="262" y="239" font-family="monospace" font-size="8.5" fill="#50607a">diskpart · chkdsk /f · defrag</text>
  <text x="262" y="250" font-family="monospace" font-size="8.5" fill="#50607a">dir · cd · copy · del · xcopy</text>
  <!-- Bottom -->
  <rect x="20" y="218" width="220" height="90" rx="8" fill="rgba(255,255,255,.6)" stroke="rgba(11,102,195,.15)" stroke-width="1"/>
  <text x="130" y="236" font-family="sans-serif" font-size="10" font-weight="800" fill="#0a4f96" text-anchor="middle">Diagnóstico rápido</text>
  <text x="30" y="250" font-family="sans-serif" font-size="9" fill="#50607a">Sin internet → ipconfig /flushdns</text>
  <text x="30" y="263" font-family="sans-serif" font-size="9" fill="#50607a">IP 169.254.x → ipconfig /renew</text>
  <text x="30" y="276" font-family="sans-serif" font-size="9" fill="#50607a">SO lento → tasklist | findstr</text>
  <text x="30" y="289" font-family="sans-serif" font-size="9" fill="#50607a">Archivo dañado → sfc /scannow</text>
  <text x="30" y="302" font-family="sans-serif" font-size="9" fill="#50607a">Ver puertos → netstat -an</text>
</svg>
