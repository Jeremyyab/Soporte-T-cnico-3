<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf1f8"/><stop offset="100%" style="stop-color:#cfdceb"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bg)" rx="16"/>
  <!-- Simulated Windows desktop -->
  <rect x="20" y="20" width="220" height="160" rx="8" fill="rgba(11,102,195,.85)"/>
  <rect x="20" y="20" width="220" height="20" rx="8" fill="rgba(10,79,150,.95)"/>
  <rect x="20" y="32" width="220" height="8" fill="rgba(10,79,150,.95)"/>
  <text x="100" y="34" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,.7)" text-anchor="middle">Panel de Control</text>
  <circle cx="228" cy="28" r="5" fill="#dc2626" opacity="0.8"/>
  <!-- Icons in panel -->
  <rect x="30" y="46" width="46" height="40" rx="5" fill="rgba(255,255,255,.15)"/>
  <text x="53" y="63" font-family="sans-serif" font-size="16" text-anchor="middle">👤</text>
  <text x="53" y="80" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">Cuentas</text>
  <rect x="83" y="46" width="46" height="40" rx="5" fill="rgba(255,255,255,.15)"/>
  <text x="106" y="63" font-family="sans-serif" font-size="16" text-anchor="middle">🌐</text>
  <text x="106" y="80" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">Red</text>
  <rect x="136" y="46" width="46" height="40" rx="5" fill="rgba(255,255,255,.15)"/>
  <text x="159" y="63" font-family="sans-serif" font-size="16" text-anchor="middle">🔒</text>
  <text x="159" y="80" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">Seguridad</text>
  <rect x="189" y="46" width="46" height="40" rx="5" fill="rgba(255,255,255,.15)"/>
  <text x="212" y="63" font-family="sans-serif" font-size="16" text-anchor="middle">🖥</text>
  <text x="212" y="80" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">Sistema</text>
  <!-- second row -->
  <rect x="30" y="92" width="46" height="40" rx="5" fill="rgba(255,255,255,.15)"/>
  <text x="53" y="109" font-family="sans-serif" font-size="16" text-anchor="middle">🖨</text>
  <text x="53" y="126" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">Disp.e impr.</text>
  <rect x="83" y="92" width="46" height="40" rx="5" fill="rgba(255,255,255,.15)"/>
  <text x="106" y="109" font-family="sans-serif" font-size="16" text-anchor="middle">🔋</text>
  <text x="106" y="126" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">Energía</text>
  <rect x="136" y="92" width="46" height="40" rx="5" fill="rgba(255,255,255,.15)"/>
  <text x="159" y="109" font-family="sans-serif" font-size="16" text-anchor="middle">📅</text>
  <text x="159" y="126" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">Fecha/Hora</text>
  <rect x="189" y="92" width="46" height="40" rx="5" fill="rgba(255,255,255,.15)"/>
  <text x="212" y="109" font-family="sans-serif" font-size="16" text-anchor="middle">🗑</text>
  <text x="212" y="126" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">Prog./caract.</text>
  <!-- Taskbar -->
  <rect x="20" y="160" width="220" height="20" rx="0" fill="rgba(0,0,0,.4)"/>
  <rect x="22" y="164" width="50" height="12" rx="3" fill="rgba(11,102,195,.8)"/>
  <text x="47" y="173" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">Inicio</text>
  <text x="165" y="173" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,.6)">11:42 AM</text>
  <!-- Right info cards -->
  <rect x="255" y="20" width="225" height="60" rx="8" fill="rgba(11,102,195,.08)" stroke="rgba(11,102,195,.2)" stroke-width="1"/>
  <text x="265" y="38" font-family="sans-serif" font-size="10" font-weight="700" fill="#0a4f96">Acceso rápido: Win + X</text>
  <text x="265" y="51" font-family="sans-serif" font-size="9" fill="#50607a">Administración de equipos · Terminal</text>
  <text x="265" y="64" font-family="sans-serif" font-size="9" fill="#50607a">Admin de discos · PowerShell admin</text>
  <rect x="255" y="88" width="225" height="60" rx="8" fill="rgba(22,163,74,.08)" stroke="rgba(22,163,74,.2)" stroke-width="1"/>
  <text x="265" y="106" font-family="sans-serif" font-size="10" font-weight="700" fill="#16a34a">Explorador de archivos (Win+E)</text>
  <text x="265" y="119" font-family="sans-serif" font-size="9" fill="#50607a">Vista: detalles · extensiones · ocultos</text>
  <text x="265" y="132" font-family="sans-serif" font-size="9" fill="#50607a">Panel izquierdo: Este equipo · Red</text>
  <rect x="255" y="156" width="225" height="60" rx="8" fill="rgba(217,119,6,.08)" stroke="rgba(217,119,6,.2)" stroke-width="1"/>
  <text x="265" y="174" font-family="sans-serif" font-size="10" font-weight="700" fill="#d97706">Adm. de tareas (Ctrl+Shift+Esc)</text>
  <text x="265" y="187" font-family="sans-serif" font-size="9" fill="#50607a">Procesos · Rendimiento · Servicios</text>
  <text x="265" y="200" font-family="sans-serif" font-size="9" fill="#50607a">Inicio automático · Usuarios activos</text>
  <!-- Shortcuts table -->
  <rect x="20" y="195" width="220" height="112" rx="8" fill="rgba(255,255,255,.6)" stroke="rgba(11,102,195,.15)" stroke-width="1"/>
  <text x="130" y="213" font-family="sans-serif" font-size="10" font-weight="800" fill="#0a4f96" text-anchor="middle">Atajos clave</text>
  <text x="30" y="228" font-family="sans-serif" font-size="8.5" fill="#50607a">Win + R → Ejecutar</text>
  <text x="30" y="240" font-family="sans-serif" font-size="8.5" fill="#50607a">Win + I → Configuración</text>
  <text x="30" y="252" font-family="sans-serif" font-size="8.5" fill="#50607a">Win + L → Bloquear equipo</text>
  <text x="30" y="264" font-family="sans-serif" font-size="8.5" fill="#50607a">Win + Pause → Propiedades sistema</text>
  <text x="30" y="276" font-family="sans-serif" font-size="8.5" fill="#50607a">msconfig · regedit · eventvwr</text>
  <text x="30" y="288" font-family="sans-serif" font-size="8.5" fill="#50607a">diskmgmt.msc · compmgmt.msc</text>
  <!-- Bottom right -->
  <rect x="255" y="224" width="225" height="83" rx="8" fill="rgba(255,255,255,.55)" stroke="rgba(11,102,195,.15)" stroke-width="1"/>
  <text x="265" y="242" font-family="sans-serif" font-size="10" font-weight="800" fill="#0a4f96">Cuentas de usuario</text>
  <text x="265" y="255" font-family="sans-serif" font-size="9" fill="#50607a">Administrador: control total</text>
  <text x="265" y="267" font-family="sans-serif" font-size="9" fill="#50607a">Usuario estándar: sin cambios sistema</text>
  <text x="265" y="279" font-family="sans-serif" font-size="9" fill="#50607a">Invitado: acceso muy limitado</text>
  <text x="265" y="291" font-family="sans-serif" font-size="9" fill="#50607a">netplwiz → gestión avanzada</text>
  <text x="265" y="301" font-family="sans-serif" font-size="9" fill="#50607a">lusrmgr.msc → usuarios locales</text>
</svg>
