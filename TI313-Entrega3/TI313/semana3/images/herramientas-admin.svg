<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf1f8"/><stop offset="100%" style="stop-color:#cfdceb"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bg)" rx="16"/>
  <text x="250" y="22" font-family="sans-serif" font-size="13" font-weight="800" fill="#0a4f96" text-anchor="middle">Herramientas Administrativas de Windows</text>
  <!-- Grid 3x2 -->
  <!-- Administrador de tareas -->
  <rect x="15" y="32" width="152" height="85" rx="9" fill="rgba(11,102,195,.08)" stroke="rgba(11,102,195,.25)" stroke-width="1.5"/>
  <text x="91" y="50" font-family="sans-serif" font-size="16" text-anchor="middle">📊</text>
  <text x="91" y="65" font-family="sans-serif" font-size="10" font-weight="800" fill="#0a4f96" text-anchor="middle">Adm. de Tareas</text>
  <text x="91" y="78" font-family="sans-serif" font-size="8.5" fill="#50607a" text-anchor="middle">Ctrl+Shift+Esc</text>
  <text x="91" y="89" font-family="sans-serif" font-size="8.5" fill="#50607a" text-anchor="middle">Procesos · CPU · RAM</text>
  <text x="91" y="110" font-family="sans-serif" font-size="8" fill="#0b66c3" text-anchor="middle">Finalizar tareas colgadas</text>
  <!-- Servicios -->
  <rect x="174" y="32" width="152" height="85" rx="9" fill="rgba(22,163,74,.08)" stroke="rgba(22,163,74,.25)" stroke-width="1.5"/>
  <text x="250" y="50" font-family="sans-serif" font-size="16" text-anchor="middle">⚙️</text>
  <text x="250" y="65" font-family="sans-serif" font-size="10" font-weight="800" fill="#16a34a" text-anchor="middle">Servicios</text>
  <text x="250" y="78" font-family="sans-serif" font-size="8.5" fill="#50607a" text-anchor="middle">services.msc</text>
  <text x="250" y="89" font-family="sans-serif" font-size="8.5" fill="#50607a" text-anchor="middle">Inicio: auto/manual/deshabilitado</text>
  <text x="250" y="110" font-family="sans-serif" font-size="8" fill="#16a34a" text-anchor="middle">Print Spooler · DHCP · WSearch</text>
  <!-- Visor de eventos -->
  <rect x="333" y="32" width="152" height="85" rx="9" fill="rgba(217,119,6,.08)" stroke="rgba(217,119,6,.25)" stroke-width="1.5"/>
  <text x="409" y="50" font-family="sans-serif" font-size="16" text-anchor="middle">📋</text>
  <text x="409" y="65" font-family="sans-serif" font-size="10" font-weight="800" fill="#d97706" text-anchor="middle">Visor de Eventos</text>
  <text x="409" y="78" font-family="sans-serif" font-size="8.5" fill="#50607a" text-anchor="middle">eventvwr.msc</text>
  <text x="409" y="89" font-family="sans-serif" font-size="8.5" fill="#50607a" text-anchor="middle">Registros: Sistema · Aplicación</text>
  <text x="409" y="110" font-family="sans-serif" font-size="8" fill="#d97706" text-anchor="middle">Error · Advertencia · Información</text>
  <!-- Administración de equipos -->
  <rect x="15" y="127" width="152" height="85" rx="9" fill="rgba(220,38,38,.08)" stroke="rgba(220,38,38,.2)" stroke-width="1.5"/>
  <text x="91" y="145" font-family="sans-serif" font-size="16" text-anchor="middle">🖥</text>
  <text x="91" y="160" font-family="sans-serif" font-size="10" font-weight="800" fill="#dc2626" text-anchor="middle">Adm. de Equipos</text>
  <text x="91" y="173" font-family="sans-serif" font-size="8.5" fill="#50607a" text-anchor="middle">compmgmt.msc</text>
  <text x="91" y="184" font-family="sans-serif" font-size="8.5" fill="#50607a" text-anchor="middle">Discos · Usuarios · Servicios</text>
  <text x="91" y="205" font-family="sans-serif" font-size="8" fill="#dc2626" text-anchor="middle">Todo en un solo lugar</text>
  <!-- Directiva de grupo -->
  <rect x="174" y="127" width="152" height="85" rx="9" fill="rgba(11,102,195,.08)" stroke="rgba(11,102,195,.2)" stroke-width="1.5"/>
  <text x="250" y="145" font-family="sans-serif" font-size="16" text-anchor="middle">🛡</text>
  <text x="250" y="160" font-family="sans-serif" font-size="10" font-weight="800" fill="#0a4f96" text-anchor="middle">Directiva de Grupo</text>
  <text x="250" y="173" font-family="sans-serif" font-size="8.5" fill="#50607a" text-anchor="middle">gpedit.msc</text>
  <text x="250" y="184" font-family="sans-serif" font-size="8.5" fill="#50607a" text-anchor="middle">Restricciones · Políticas</text>
  <text x="250" y="205" font-family="sans-serif" font-size="8" fill="#0b66c3" text-anchor="middle">Solo Win Pro/Enterprise</text>
  <!-- Monitor de rendimiento -->
  <rect x="333" y="127" width="152" height="85" rx="9" fill="rgba(22,163,74,.08)" stroke="rgba(22,163,74,.2)" stroke-width="1.5"/>
  <text x="409" y="145" font-family="sans-serif" font-size="16" text-anchor="middle">📈</text>
  <text x="409" y="160" font-family="sans-serif" font-size="10" font-weight="800" fill="#16a34a" text-anchor="middle">Monitor Rendimiento</text>
  <text x="409" y="173" font-family="sans-serif" font-size="8.5" fill="#50607a" text-anchor="middle">perfmon.msc</text>
  <text x="409" y="184" font-family="sans-serif" font-size="8.5" fill="#50607a" text-anchor="middle">CPU · Disco · Red en tiempo real</text>
  <text x="409" y="205" font-family="sans-serif" font-size="8" fill="#16a34a" text-anchor="middle">Registrar datos de rendimiento</text>
  <!-- Bottom: Ejecutar (Win+R) shortcuts -->
  <rect x="15" y="224" width="470" height="85" rx="10" fill="rgba(255,255,255,.6)" stroke="rgba(11,102,195,.15)" stroke-width="1"/>
  <text x="250" y="242" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0a4f96" text-anchor="middle">⚡ Comandos Win+R esenciales para soporte</text>
  <text x="25" y="258" font-family="sans-serif" font-size="9" fill="#50607a"><tspan font-family="monospace" font-weight="700">msconfig</tspan> → Config. arranque</text>
  <text x="175" y="258" font-family="sans-serif" font-size="9" fill="#50607a"><tspan font-family="monospace" font-weight="700">regedit</tspan> → Registro de Windows</text>
  <text x="340" y="258" font-family="sans-serif" font-size="9" fill="#50607a"><tspan font-family="monospace" font-weight="700">cleanmgr</tspan> → Limpieza disco</text>
  <text x="25" y="272" font-family="sans-serif" font-size="9" fill="#50607a"><tspan font-family="monospace" font-weight="700">sysdm.cpl</tspan> → Propiedades sistema</text>
  <text x="175" y="272" font-family="sans-serif" font-size="9" fill="#50607a"><tspan font-family="monospace" font-weight="700">ncpa.cpl</tspan> → Adaptadores de red</text>
  <text x="340" y="272" font-family="sans-serif" font-size="9" fill="#50607a"><tspan font-family="monospace" font-weight="700">appwiz.cpl</tspan> → Quitar programas</text>
  <text x="25" y="286" font-family="sans-serif" font-size="9" fill="#50607a"><tspan font-family="monospace" font-weight="700">lusrmgr.msc</tspan> → Usuarios locales</text>
  <text x="175" y="286" font-family="sans-serif" font-size="9" fill="#50607a"><tspan font-family="monospace" font-weight="700">firewall.cpl</tspan> → Firewall Win</text>
  <text x="340" y="286" font-family="sans-serif" font-size="9" fill="#50607a"><tspan font-family="monospace" font-weight="700">control</tspan> → Panel de Control</text>
  <text x="25" y="300" font-family="sans-serif" font-size="9" fill="#50607a"><tspan font-family="monospace" font-weight="700">mstsc</tspan> → Escritorio remoto (RDP)</text>
  <text x="175" y="300" font-family="sans-serif" font-size="9" fill="#50607a"><tspan font-family="monospace" font-weight="700">msinfo32</tspan> → Info del sistema</text>
  <text x="340" y="300" font-family="sans-serif" font-size="9" fill="#50607a"><tspan font-family="monospace" font-weight="700">dxdiag</tspan> → Diagnóstico DirectX</text>
</svg>
